<style>
  :root{
    --azul:#0d4f8b; --azul-2:#1567b8; --azul-claro:#e8f1fb;
    --cinza:#f4f6f9; --borda:#d8dee6; --texto:#1c2733; --muted:#67727e;
    --verde:#1a9b56; --vermelho:#d0433b; --amarelo:#d9a300;
    --sombra:0 1px 3px rgba(16,32,53,.08),0 4px 16px rgba(16,32,53,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--cinza);color:var(--texto);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,var(--azul) 0%,#083a68 100%)}
  .login-card{background:#fff;border-radius:14px;padding:38px 34px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
  .brand .logo{width:38px;height:38px;border-radius:9px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .brand h1{font-size:22px;margin:0;color:var(--azul);letter-spacing:-.5px}
  .login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:8px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--azul-2);box-shadow:0 0 0 3px var(--azul-claro)}
  .btn{background:var(--azul);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-weight:600;width:100%}
  .btn:hover{background:var(--azul-2)}
  .btn.sec{background:#fff;color:var(--azul);border:1px solid var(--borda);width:auto;padding:8px 14px}
  .btn.sec:hover{background:var(--azul-claro)}
  .btn.sm{width:auto;padding:7px 12px;font-size:13px}
  .btn.danger{background:var(--vermelho)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--borda);width:auto;padding:7px 12px}
  .msg{font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .msg.err{color:var(--vermelho)} .msg.ok{color:var(--verde)}

  /* ---------- Shell ---------- */
  #app{display:flex;flex-direction:column;min-height:100vh}
  header.top{background:var(--azul);color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;box-shadow:var(--sombra);position:sticky;top:0;z-index:20}
  header .logo{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:800;margin-right:9px}
  header .title{font-weight:700;font-size:17px;letter-spacing:-.3px}
  nav.menu{display:flex;gap:4px;margin-left:26px;flex:1}
  nav.menu a{color:#cfe0f2;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px}
  nav.menu a:hover{background:rgba(255,255,255,.12);color:#fff}
  nav.menu a.active{background:#fff;color:var(--azul)}
  .user-box{display:flex;align-items:center;gap:12px;font-size:13px}

  main{padding:22px;max-width:1180px;margin:0 auto;width:100%}

  .card{background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);padding:18px 20px;margin-bottom:18px}
  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{margin:0;font-size:20px;letter-spacing:-.4px}
  .spacer{flex:1}
  .search{position:relative}
  .search input{padding:9px 12px 9px 34px;border:1px solid var(--borda);border-radius:8px;width:260px;outline:none}
  .search input:focus{border-color:var(--azul-2);box-shadow:0 0 0 3px var(--azul-claro)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--borda);white-space:nowrap}

  .row-actions button{border:1px solid var(--borda);background:#fff;border-radius:7px;padding:5px 9px;margin-left:5px;color:var(--azul)}

  /* sub tabs */

  .modal .m-body{padding:20px;max-height:70vh;overflow:auto}
  .modal .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--borda)}
  .x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);line-height:1}

  /* peso mini table */
  .pesos-tbl{width:100%;border:1px solid var(--borda);border-radius:8px;overflow:hidden;margin-top:6px}
  .pesos-tbl .ph{display:grid;grid-template-columns:1fr 1fr 96px 40px;background:var(--cinza);padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .pesos-tbl .pr{display:grid;grid-template-columns:1fr 1fr 96px 40px;gap:8px;padding:7px 10px;align-items:center;border-top:1px solid #eef1f5}
  .pesos-tbl .pr label.prin{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600;cursor:pointer}
  .pesos-tbl .pr input{padding:7px 9px;border:1px solid var(--borda);border-radius:6px;width:100%}
  .pesos-tbl .pr button{border:none;background:#fdecea;color:var(--vermelho);border-radius:6px;padding:6px}

  .breakdown{background:var(--azul-claro);border:1px solid #cfe0f2;border-radius:10px;padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.55}
  .breakdown b{color:var(--azul)}
  .breakdown .lin{display:flex;justify-content:space-between;padding:3px 0}
  .breakdown .lin.total{border-top:1px dashed #a9c7e6;margin-top:6px;padding-top:8px;font-weight:700}
  .breakdown table.bd{width:100%;border-collapse:collapse;margin-top:8px}
  .breakdown table.bd th,.breakdown table.bd td{padding:5px 8px;font-size:13px;vertical-align:top}
  .breakdown table.bd thead th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid #cfe0f2}
  .breakdown table.bd .num{text-align:right;white-space:nowrap}
  .breakdown table.bd tbody tr td{border-top:1px solid #dce8f5}
  .breakdown table.bd tr.vv td{background:#ffffff9c;font-weight:600}
  .breakdown table.bd tr.tot td{border-top:2px solid #a9c7e6;font-weight:700}
  .breakdown table.bd tr.sep td{border-top:2px solid #a9c7e6}
  .breakdown table.bd col.cprov{background:#eef7f0}

  .stat{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:14px 16px}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stat .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.5px}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--texto);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:var(--vermelho)} .toast.ok{background:var(--verde)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  @media(max-width:720px){.grid,.grid.g3,.grid.g4{grid-template-columns:1fr}nav.menu{overflow:auto}}
</style>

<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="brand"><div class="logo">PC</div><h1>PreforCoast</h1></div>
    <p class="login-sub">Sistema de precificação de Alças Preformadas</p>

</div>

<!-- ============================================================ -->
<!--  APLICAÇÃO                                                    -->
<!-- ============================================================ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">PC</div><div class="title">PreforCoast</div>
    <nav class="menu">
      <a href="#" data-sec="cadastros" onclick="go('cadastros',event)">Cadastros</a>
      <a href="#" data-sec="tabela" onclick="go('tabela',event)">Tabela de Preço</a>
      <a href="#" data-sec="formacao" onclick="go('formacao',event)">Formação de Preços</a>

    </div>
  </header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO  —  PREENCHA COM OS DADOS DO SEU PROJETO SUPABASE
   (Painel Supabase > Project Settings > API)
   ============================================================ */
const SUPABASE_URL      = "https://mgnhecuyuxqoquuukatx.supabase.co";      // ex: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbmhlY3V5dXhxb3F1dXVrYXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzI1ODEsImV4cCI6MjEwMjMwODU4MX0.mhGnLZ1aqsboD9V9l61h1oa6O0LsduPt7a9CX4AfMTA";   // chave "anon public"
/* ============================================================ */

let sb = null;
if (window.supabase) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- Estado ---------------- */
const S = {
  user:null, produtos:[], precos:{}, config:null, propostas:[], propostaEdit:null,
  clientType:'18', formSub:'precificar', search:{cadastros:'',tabela:'',precificar:'',propItem:''}
};

/* ---------------- Helpers ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const esc = t => (t==null?'':String(t)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function brNum(v){ // converte string BR ("1.234,56" ou "6,80") em número
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  let s=String(v).trim().replace(/[^\d.,-]/g,'');
  if(s.includes('.')&&s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN   = (n,d=2)=> (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
// Máscara "da direita pra esquerda": digita 1 -> 0,01 ; 15 -> 0,15 ; 158 -> 1,58 (dec=2 padrão; peso usa dec=3)
function maskNum(el, dec){ dec=(dec==null?2:dec); let v=el.value.replace(/\D/g,''); el.value=(parseInt(v||'0',10)/Math.pow(10,dec)).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function maskBRL(el){ maskNum(el,2); }
function toast(msg,type=''){ const t=$('#toast'); t.textContent=msg; t.className='toast show '+type; setTimeout(()=>t.className='toast',2600); }
async function logAcao(acao,detalhe=''){ try{ await sb.from('logs').insert({user_email:S.user?.email,acao,detalhe}); }catch(e){} }

/* ---------------- Parser de descrição ---------------- */
// cor canônica -> variantes (regex); usa limites que respeitam acentos
const COR_MAP=[
  ['BRANCO',['BRANCO','BRANCA']],['PRETO',['PRETO','PRETA']],['AZUL',['AZUL']],
  ['VERMELHO',['VERMELHO','VERMELHA']],['VERDE',['VERDE']],['AMARELO',['AMARELO','AMARELA']],
  ['LARANJA',['LARANJA']],['MARROM',['MARROM']],['CINZA',['CINZA']],['ROSA',['ROSA']],
  ['ROXO',['ROXO','ROXA']],['VIOLETA',['VIOLETA']],['LILÁS',['LIL[ÁA]S']],
  ['PÚRPURA',['P[ÚU]RPURA']],['BEGE',['BEGE']]
];
const _W='0-9A-Za-zÀ-ÿ'; // "letras" incluindo acentuadas
function _tok(t){ return new RegExp('(?<!['+_W+'])'+t+'(?!['+_W+'])'); } // token isolado (respeita acento)
function parseDescricao(nome){
  const s=(nome||'').toUpperCase();
  const o={tipo:null,materia_prima:null,range_min:null,range_max:null,cor:null,comprimento:null,qtd_varetas:null,alertas:[]};
  // Tipo
  if(/LA[ÇC]O/.test(s)) o.tipo='LAÇO PREFORMADO';
  else if(/AL[ÇC]A|ALCA/.test(s)) o.tipo='ALÇA PREFORMADA';
  else if(/DERIVA/.test(s)) o.tipo='DERIVAÇÃO';
  else if(/EMENDA/.test(s)) o.tipo='EMENDA';
  else if(/CONJ/.test(s)) o.tipo='CONJUNTO PREFORMADO';
  else o.alertas.push('Tipo');
  // Matéria prima (Alumínio tem prioridade explícita; evita falso "AL" em "ALÇA")
  if(/AL\s+CABO\s+OPTICO/.test(s) || /ALUM[IÍ]NIO/.test(s) || _tok('AL').test(s)) o.materia_prima='Aluminio';
  else if(/AC\s+CCE/.test(s) || _tok('A[ÇC]O').test(s) || /GALV/.test(s) || _tok('AC').test(s)) o.materia_prima='Aco';
  else o.alertas.push('Matéria Prima');
  // Range (dois decimais separados por - – ou " A "; mm opcional). Fallback: bitola única X,XXmm
  let r=s.match(/(\d+[,.]\d+)\s*[-–]\s*(\d+[,.]\d+)\s*(?:MM)?/) || s.match(/(\d+[,.]\d+)\s+A\s+(\d+[,.]\d+)/);
  let usado='';
  if(r){ o.range_min=brNum(r[1]); o.range_max=brNum(r[2]); usado=r[0]; }
  else { const m=s.match(/(\d+[,.]\d+)\s*MM/); if(m){ o.range_min=o.range_max=brNum(m[1]); usado=m[0]; } else o.alertas.push('Range'); }
  // Comprimento (mm; fallback CM -> x10)
  const semRange = usado ? s.replace(usado,' ') : s;
  const c=semRange.match(/(\d{2,4})\s*MM/);
  if(c) o.comprimento=parseInt(c[1],10);
  else { const cm=s.match(/(\d{2,3})\s*CM\b/); if(cm) o.comprimento=parseInt(cm[1],10)*10; else o.alertas.push('Comprimento'); }
  // Varetas (NV, sem letra logo após; ou "N FIOS")
  const v=s.match(/(\d+)\s*V(?![A-Za-z])/) || s.match(/(\d+)\s*(?:FIOS|FIO)\b/);
  if(v) o.qtd_varetas=parseInt(v[1],10); else o.alertas.push('Varetas');
  // Cor (canônica)
  for(const [canon,vars] of COR_MAP){ if(vars.some(vv=>_tok(vv).test(s))){ o.cor=canon; break; } }
  if(!o.cor) o.alertas.push('Cor');
  return o;
}

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */
async function doLogin(e){
  e.preventDefault();
  const msg=$('#loginMsg'); const btn=$('#loginBtn');
  msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.textContent='Entrando...';
  const email=$('#loginEmail').value.trim(), password=$('#loginPass').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false; btn.textContent='Entrar';
  if(error){ msg.className='msg err'; msg.textContent='Não foi possível entrar: '+error.message; return false; }
  S.user=data.user; await startApp(); logAcao('login'); return false;
}
async function doLogout(){ await logAcao('logout'); await sb.auth.signOut(); location.reload(); }

async function startApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#userEmail').textContent=S.user.email;
  await loadAll();
  go('cadastros');
}

/* ============================================================
   CARGA DE DADOS
   ============================================================ */
async function loadAll(){
  await Promise.all([loadProdutos(), loadPrecos(), loadConfig(), loadMP(), loadPropostas()]);
}
async function loadPropostas(){
  try{
    const {data,error}=await sb.from('propostas').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    S.propostas=data||[];
  }catch(e){ /* mantém */ }
}
// Busca TODAS as linhas, driblando o limite de 1000 do Supabase (paginação por range)
async function fetchAll(table, order){
  const pageSize=1000; let from=0, all=[];
  for(;;){
    let q=sb.from(table).select('*').range(from, from+pageSize-1);
    if(order) q=q.order(order);
    const {data,error}=await q;
    if(error) throw error;
    all=all.concat(data||[]);
    if(!data || data.length<pageSize) break;
    from+=pageSize;
  }
  return all;
}
async function loadMP(){
  try{ S.mpcustos=await fetchAll('materia_prima_custos','material'); }
  catch(e){ /* erro passageiro: mantém o que já estava carregado */ }
}
async function loadProdutos(){
  try{ S.produtos=await fetchAll('produtos','descricao'); }
  catch(e){ toast('Erro ao carregar produtos (mantendo dados atuais)','err'); }
}
async function loadPrecos(){
  try{
    const data=await fetchAll('precificacoes');
    S.precos={}; S.precosArr=data;
    data.forEach(p=>{ S.precos[chavePreco(p.produto_id,p.bitola)]=p; });
  }catch(e){ /* mantém preços atuais */ }
}
// chave única de precificação por produto + bitola
function chavePreco(pid, bitola){ return pid+'::'+normBit(bitola); }
function precoDe(pid, bitola){ return S.precos[chavePreco(pid,bitola)]; }
function precosDoProduto(pid){ return (S.precosArr||[]).filter(p=>p.produto_id===pid); }
function matLabel(mp){ return mp==='Aluminio'?'Alumínio':(mp==='Aco'?'Aço':'—'); }
function matTag(mp){ return mp==='Aluminio'?'<span class="tag alu">Alumínio</span>':(mp==='Aco'?'<span class="tag aco">Aço</span>':'—'); }
async function loadConfig(){
  const {data,error}=await sb.from('configuracoes').select('*').eq('id',1).single();
  if(!error && data) S.config=data;   // erro passageiro: mantém config atual
  else if(!S.config) S.config={};
}

/* ============================================================
   ROTEADOR
   ============================================================ */
function go(sec,e){
  if(e) e.preventDefault();
  document.querySelectorAll('nav.menu a').forEach(a=>a.classList.toggle('active',a.dataset.sec===sec));
  if(sec==='cadastros') renderCadastros();
  else if(sec==='tabela') renderTabela();
  else if(sec==='formacao') renderFormacao();
  else if(sec==='propostas') renderPropostas();
  else if(sec==='importar') renderImportar();
  else if(sec==='config') renderConfig();
}

/* ------------------------------------------------------------
   Busca sem perder o foco: re-renderiza e devolve o foco/cursor
   para o novo campo de busca (o render recria o input).
   ------------------------------------------------------------ */
function onSearch(el, key, renderFn){
  const pos = el.selectionStart;
  S.search[key] = el.value;
  renderFn();
  const ni = document.getElementById('searchBox_'+key);
  if(ni){ ni.focus(); try{ ni.setSelectionRange(pos,pos); }catch(e){} }
}

function reparse(){
  const nome=($('#f_descricao')?.value||'')+' '+($('#f_codigo')?.value||'');
  const o=parseDescricao(nome);
  // só auto-preenche se ainda estiver vazio (não sobrescreve edição manual)
  const auto=(elId,val,flagId)=>{ const el=$(elId),fl=$(flagId);
    if(el && (el.value==='' ) && val!=null && val!==''){ el.value=val; if(fl){fl.textContent='auto';fl.className='auto-flag';} } };
  auto('#f_tipo',o.tipo,'#fl_tipo');
  auto('#f_mp',o.materia_prima,'#fl_mp');
  auto('#f_cor',o.cor,'#fl_cor');
  auto('#f_rmin',o.range_min!=null?fmtN(o.range_min):'','#fl_range');
  auto('#f_rmax',o.range_max!=null?fmtN(o.range_max):'',null);
  auto('#f_comp',o.comprimento,'#fl_comp');
  auto('#f_var',o.qtd_varetas,'#fl_var');
  const box=$('#autoAlert');
  if(box){
    if(o.alertas.length) box.innerHTML=`<div class="breakdown" style="background:#fff8e6;border-color:#f0dca0"><b style="color:${'#9a7400'}">⚠ Preencha manualmente:</b> ${o.alertas.join(', ')} — não foi possível identificar pela descrição.</div>`;
    else box.innerHTML='';
  }
}
function renderPesos(){
  const box=$('#pesosBox'); if(!box) return;
  const multi=window._pesos.length>1;
  box.innerHTML=`<div class="pesos-tbl"><div class="ph"><div>Bitola da MP</div><div>Peso (kg)</div><div>${multi?'Principal':''}</div><div></div></div>
    ${window._pesos.map((r,i)=>`<div class="pr">
      <input value="${esc(r.bitola||'')}" placeholder="ex: 1,68" onkeyup="maskNum(this,2);window._pesos[${i}].bitola=this.value">
      <input value="${r.peso!=null?fmtN(r.peso,3):''}" placeholder="ex: 0,420" onkeyup="maskNum(this,3);window._pesos[${i}].peso=brNum(this.value)">
      <label class="prin" title="Bitola principal (preço mostrado na Tabela de Preços)">${multi?`<input type="radio" name="peso_principal" ${r.principal?'checked':''} onchange="setPrincipal(${i})"> Principal`:''}</label>
      <button onclick="window._pesos.splice(${i},1);renderPesos()">✕</button></div>`).join('')||'<div class="pr" style="color:var(--muted);grid-template-columns:1fr">Nenhuma bitola. Adicione ao menos uma se já souber o peso.</div>'}
  </div>${multi?'<div class="hint" style="margin-top:6px">A bitola marcada como <b>Principal</b> é a que aparece na linha do produto na Tabela de Preços.</div>':''}`;
}
function setPrincipal(i){ window._pesos.forEach((x,j)=>x.principal=(j===i)); renderPesos(); }
function addPeso(){ window._pesos.push({bitola:'',peso:null,principal:window._pesos.length===0}); renderPesos(); }

async function saveProduto(id){
  const codigo=$('#f_codigo').value.trim(), descricao=$('#f_descricao').value.trim();
  if(!codigo||!descricao){ toast('Código e Descrição são obrigatórios','err'); return; }
  let pesosSave=window._pesos.filter(r=>r.bitola||r.peso);
  if(pesosSave.length && !pesosSave.some(r=>r.principal)) pesosSave[0].principal=true; // garante 1 principal
  const rec={ codigo, descricao,
    tipo:$('#f_tipo').value||null,
    materia_prima:$('#f_mp').value||null,
    cor:$('#f_cor').value.trim()||null,
    range_min: $('#f_rmin').value?brNum($('#f_rmin').value):null,
    range_max: $('#f_rmax').value?brNum($('#f_rmax').value):null,
    comprimento: $('#f_comp').value?parseInt($('#f_comp').value,10):null,
    qtd_varetas: $('#f_var').value?parseInt($('#f_var').value,10):null,
    pesos: pesosSave,
    created_by:S.user.email
  };
  let error;
  if(id){ ({error}=await sb.from('produtos').update(rec).eq('id',id)); }
  else  { ({error}=await sb.from('produtos').insert(rec)); }
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  await loadProdutos(); closeModal(); renderCadastros();
  toast(id?'Produto atualizado':'Produto cadastrado','ok');
  logAcao(id?'editar_produto':'novo_produto',descricao);
}
async function delProduto(id){
  const p=S.produtos.find(x=>x.id===id);
  confirmBox(`Excluir o produto <b>${esc(p?.descricao||'')}</b>? Isso também remove a precificação dele.`, async ()=>{
    const {error}=await sb.from('produtos').delete().eq('id',id);
    if(error){ toast('Erro ao excluir','err'); return; }
    await loadProdutos(); await loadPrecos(); closeModal(); renderCadastros();
    toast('Produto excluído','ok'); logAcao('excluir_produto',p?.descricao);
  });
}

/* ============================================================
   TELA: TABELA DE PREÇOS
   ============================================================ */
const CLIENTES=[
  {k:'18',lbl:'ICMS 18%'},{k:'12',lbl:'ICMS 12%'},
  {k:'7',lbl:'ICMS 7%'},{k:'simples',lbl:'Simples Nacional'}
];
function descontoCliente(k){
  const c=S.config||{};
  return {'18':c.desc_icms18,'12':c.desc_icms12,'7':c.desc_icms7,'simples':c.desc_simples}[k]||0;
}
function bitolaPrincipal(prod){
  const arr=Array.isArray(prod.pesos)?prod.pesos:[];
  const p=arr.find(x=>x.principal);
  return p? p.bitola : (arr[0]?.bitola ?? null);
}
function toggleTab(pid){ if(!S.tabExp) S.tabExp=new Set(); if(S.tabExp.has(pid)) S.tabExp.delete(pid); else S.tabExp.add(pid); renderTabela(); }
function renderTabela(){
  const q=S.search.tabela.toLowerCase();
  const desc=descontoCliente(S.clientType)/100;
  if(!S.tabExp) S.tabExp=new Set();
  // agrupa por produto: só produtos com ao menos uma bitola precificada
  const groups=[];
  S.produtos.forEach(prod=>{
    let prs=precosDoProduto(prod.id);
    if(!prs.length) return;
    if(q && !((prod.descricao+' '+prod.codigo+' '+prs.map(p=>p.bitola).join(' ')).toLowerCase().includes(q))) return;
    prs=prs.slice().sort((a,b)=>String(a.bitola||'').localeCompare(String(b.bitola||'')));
    groups.push({prod, prs});
  });
  groups.sort((a,b)=>a.prod.codigo.localeCompare(b.prod.codigo));
  const linha=(pr,desc)=>{ const vd=pr.valor_distribuidor*(1-desc), vp=pr.valor_provedor*(1-desc); return {vd,vp}; };
  const bodyHtml = groups.length ? groups.map(({prod,prs})=>{
    const principalBit=bitolaPrincipal(prod);
    const main = prs.find(p=>principalBit && normBit(p.bitola)===normBit(principalBit)) || prs[0];
    const multi = prs.length>1;
    const exp = S.tabExp.has(prod.id);
    const {vd,vp}=linha(main,desc);
    const isMainPrin = principalBit && normBit(main.bitola)===normBit(principalBit);
    let html=`<tr>
      <td style="white-space:nowrap">${multi?`<button class="expbtn" title="Ver preços por bitola" onclick="toggleTab('${prod.id}')">${exp?'−':'+'}</button>`:'<span style="display:inline-block;width:30px"></span>'}<b>${esc(prod.codigo)}</b></td>
      <td>${esc(prod.descricao)}</td>
      <td>${esc(main.bitola||'—')}${isMainPrin&&multi?' <span class="tag prin">principal</span>':''}</td>
      <td class="num">${fmtN(main.peso,3)}</td>
      <td class="num">${fmtBRL(vd)}</td><td class="num">${fmtBRL(vp)}</td></tr>`;
    if(multi && exp){
      html+=prs.map(p=>{ const r=linha(p,desc); const isP=principalBit&&normBit(p.bitola)===normBit(principalBit);
        return `<tr class="subrow"><td></td><td style="padding-left:26px">↳ bitola</td>
          <td>${esc(p.bitola||'—')}${isP?' <span class="tag prin">principal</span>':''}</td>
          <td class="num">${fmtN(p.peso,3)}</td>
          <td class="num">${fmtBRL(r.vd)}</td><td class="num">${fmtBRL(r.vp)}</td></tr>`;
      }).join('');
    }
    return html;
  }).join('') : `<tr><td colspan="6"><div class="empty">Nenhum produto precificado ainda. Vá em <b>Formação de Preços → Precificar</b>.</div></td></tr>`;
  $('#view').innerHTML=`
    <div class="page-head">
      <h2>Tabela de Preços</h2><div class="spacer"></div>
      <div class="search"><span class="ic">🔍</span>
        <input id="searchBox_tabela" placeholder="Buscar produto..." value="${esc(S.search.tabela)}"
          oninput="onSearch(this,'tabela',renderTabela)"></div>
    </div>
    <div class="card">
      <label style="font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:8px">Regime tributário do cliente</label>
      <div class="pills">${CLIENTES.map(c=>`<button class="pill ${S.clientType===c.k?'active':''}" onclick="S.clientType='${c.k}';renderTabela()">${c.lbl}</button>`).join('')}</div>
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Código</th><th>Descrição</th><th>Bitola</th><th class="num">Peso (kg)</th>
          <th class="num">Venda Distribuidor</th><th class="num">Venda Provedor</th></tr></thead>
        <tbody>${bodyHtml}</tbody>
      </table>
    </div>
    <div class="hint">A linha do produto mostra a <b>bitola principal</b>. No <b>+</b> (quando há mais de uma bitola precificada) você abre os preços por bitola. ${desc>0?`Preços já com desconto de ${fmtN(desc*100,1)}% para <b>${CLIENTES.find(c=>c.k===S.clientType).lbl}</b>.`:`Valor cheio — <b>${CLIENTES.find(c=>c.k===S.clientType).lbl}</b>.`}</div>`;
}

      <button class="${S.formSub==='mp'?'active':''}" onclick="S.formSub='mp';renderFormacao()">Custo de Matéria-Prima</button>

function subPrecificar(){
  const q=S.search.precificar.toLowerCase();
  const prods=S.produtos.filter(p=>!q||(p.descricao+' '+p.codigo).toLowerCase().includes(q));
  // uma linha por produto + bitola (bitolas vêm da mini-tabela de pesos do cadastro)
  const rows=[];
  prods.forEach(p=>{
    const bits=(Array.isArray(p.pesos)&&p.pesos.length)? p.pesos : [{bitola:'',peso:null}];
    bits.forEach(b=>rows.push({p, bitola:b.bitola||'', peso:b.peso}));
  });
  $('#subview').innerHTML=`
    <div class="page-head">
      <div class="search"><span class="ic">🔍</span>
        <input id="searchBox_precificar" placeholder="Buscar produto..." value="${esc(S.search.precificar)}"
          oninput="onSearch(this,'precificar',subPrecificar)"></div>
      <div class="spacer"></div>
      <div class="hint" style="margin:0">Uma linha por produto + bitola. Cada bitola é precificada separadamente.</div>
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Código</th><th>Descrição</th><th>Matéria Prima</th><th>Bitola</th><th class="num">Peso (kg)</th>
          <th class="num">Distribuidor</th><th class="num">Provedor</th><th>Status</th><th></th></tr></thead>
        <tbody>${ rows.length ? rows.map(({p,bitola,peso})=>{
          const pr=precoDe(p.id,bitola);
          const pesoShow = pr? pr.peso : peso;
          const bitAttr=(bitola||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          return `<tr>
            <td><b>${esc(p.codigo)}</b></td><td>${esc(p.descricao)}</td><td>${matTag(p.materia_prima)}</td>
            <td>${esc(bitola||'—')}</td>
            <td class="num">${pesoShow!=null?fmtN(pesoShow,3):'—'}</td>
            <td class="num">${pr?fmtBRL(pr.valor_distribuidor):'—'}</td>
            <td class="num">${pr?fmtBRL(pr.valor_provedor):'—'}</td>
            <td>${pr?'<span class="tag ok">Precificado</span>':'<span class="tag no">Pendente</span>'}</td>
            <td class="row-actions"><button title="${pr?'Editar':'Precificar'}" onclick="openPrecificar('${p.id}','${bitAttr}')">${pr?'✏️ Editar':'🏷️ Precificar'}</button></td></tr>`;
        }).join('') : `<tr><td colspan="9"><div class="empty">Nenhum produto encontrado.</div></td></tr>`}</tbody>
      </table>
    </div>`;
}

function openPrecificar(pid, bitola){
  bitola = bitola||'';
  const p=S.produtos.find(x=>x.id===pid);
  const pr=precoDe(pid, bitola);
  const bitolas=Array.isArray(p.pesos)?p.pesos:[];
  const bRow=bitolas.find(b=>normBit(b.bitola)===normBit(bitola));
  const pesoIni = pr? pr.peso : (bRow?.peso ?? '');
  const padrao = variaveisPorMateria(p.materia_prima);
  const vd = pr?pr.variavel_distribuidor : (padrao.dist||0);
  const vp = pr?pr.variavel_provedor : (padrao.prov||0);
  window._precCtx={pid, bitola, valEditD:pr?pr.valor_distribuidor:null, valEditP:pr?pr.valor_provedor:null, icms:pr?.icms_flag||'18',
    aba:'nacional', cotacaoDolar:Number((S.config||{}).cotacao_dolar)||0, valExp:null};
  const bitField = bitola
    ? `<input readonly value="${esc(bitola)}">`
    : `<input id="p_bit_txt" value="" placeholder="ex: 1,68" onkeyup="maskNum(this,2);window._precCtx.bitola=this.value;drawBreakdown()">`;
  modal(`Precificar — ${esc(p.descricao)}${bitola?' · Bitola '+esc(bitola):''}`, `
    <div class="grid g3">

function currentPeso(){ return brNum($('#p_peso')?.value); }
function recalc(){
  const peso=currentPeso();
  const vd=brNum($('#p_vd')?.value), vp=brNum($('#p_vp')?.value);
  let rd=vd*peso, rp=vp*peso;
  // Preço sugerido: se não há variável (rd/rp=0), sugere pelo custo da MP + margem-alvo
  const icmsS=$('#p_icms')?.value||'18'; const cargaS=TAX[icmsS]||0;
  const fidcS=(Number((S.config||{}).custo_fidc_pct)||0)/100;
  const prodS=S.produtos.find(x=>x.id===window._precCtx.pid);
  if(!(rd>0)){ const s=precoSugerido(prodS&&prodS.materia_prima, window._precCtx.bitola, peso, 'distribuidor', cargaS, fidcS); if(s) rd=s.valor; }
  if(!(rp>0)){ const s=precoSugerido(prodS&&prodS.materia_prima, window._precCtx.bitola, peso, 'provedor', cargaS, fidcS); if(s) rp=s.valor; }
  if(window._precCtx.valEditD==null){ $('#p_rd').value=fmtN(rd); window._precCtx.valEditD=rd; }
  if(window._precCtx.valEditP==null){ $('#p_rp').value=fmtN(rp); window._precCtx.valEditP=rp; }
  // se usuário não editou manualmente, acompanha o cálculo:
  if(!$('#p_rd').dataset.touched){ $('#p_rd').value=fmtN(rd); window._precCtx.valEditD=rd; }
  if(!$('#p_rp').dataset.touched){ $('#p_rp').value=fmtN(rp); window._precCtx.valEditP=rp; }
  drawBreakdown();
}

}

function piInit(){
  const c=S.config||{};
  if(!window._pi) window._pi={
    md: Number(c.margem_alvo_pct)||20,
    mp: Number(c.margem_alvo_prov_pct)||Number(c.margem_alvo_pct)||20,

  };
}
// custo unitário e preço sugerido de um produto+bitola, com a margem/regime/arredondamento do run
function piCalcRow(prod, bitola, peso){
  const c=S.config||{};
  const carga=TAX[window._pi.regime]||0;
  const fidc=(Number(c.custo_fidc_pct)||0)/100;
  const custoKg=custoKgMP(prod.materia_prima, bitola);
  if(custoKg==null) return null;                 // sem custo de MP → fora
  const custoMP=custoKg*peso;
  const sd=precoSugerido(prod.materia_prima,bitola,peso,'distribuidor',carga,fidc,0,null,window._pi.md/100);
  const sp=precoSugerido(prod.materia_prima,bitola,peso,'provedor',carga,fidc,0,null,window._pi.mp/100);
  if(!sd||!sp) return null;
  let vd=sd.valor, vp=sp.valor;
  const step=Number(window._pi.step)||0;
  if(step>0){ vd=Math.ceil(vd/step-1e-9)*step; vp=Math.ceil(vp/step-1e-9)*step; }  // arredonda p/ cima
  // margem resultante = lucro líquido / venda, já com o preço (arredondado)
  const r=ratiosBaseConfig();
  const base=1-(r.frFixo+r.frVar+fidc+r.comis+carga);
  const mgd=vd>0?(base - custoMP/vd)*100:0;
  const mgp=vp>0?(base - custoMP/vp)*100:0;
  return {custoKg,custoMP,vd,vp,mgd,mgp};
}
function piGerar(){
  piInit();
  window._pi.md=parseFloat($('#pi_md').value)||0;
  window._pi.mp=parseFloat($('#pi_mp').value)||0;
  window._pi.regime=$('#pi_regime').value;
  window._pi.step=Number($('#pi_step').value)||0;
  const rows=[];
  (S.produtos||[]).forEach(prod=>{
    const bits=Array.isArray(prod.pesos)?prod.pesos:[];
    bits.forEach(b=>{
      const peso=Number(b.peso)||0; if(peso<=0) return;
      const calc=piCalcRow(prod, b.bitola||'', peso);
      if(!calc) return;
      const atual=precoDe(prod.id, b.bitola||'');
      rows.push({pid:prod.id, codigo:prod.codigo, descricao:prod.descricao, mp:prod.materia_prima,
        bitola:b.bitola||'', peso, custoMP:calc.custoMP, vd:calc.vd, vp:calc.vp, mgd:calc.mgd, mgp:calc.mgp,
        atualD:atual?atual.valor_distribuidor:null, atualP:atual?atual.valor_provedor:null,
        novo:!atual});
    });
  });
  rows.sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo))||String(a.bitola).localeCompare(String(b.bitola)));
  window._pi.rows=rows;
  window._pi.sel=new Set(rows.map((_,i)=>i));   // tudo marcado por padrão
  renderFormacao();
}
function piMarcarTodos(v){ const pi=window._pi; if(!pi||!pi.rows) return; pi.sel = v? new Set(pi.rows.map((_,i)=>i)) : new Set(); renderFormacao(); }
function piTog(i, el){ const s=window._pi.sel; if(el.checked) s.add(i); else s.delete(i); const c=$('#pi_count'); if(c) c.textContent=s.size; }
async function piAplicar(){
  const pi=window._pi;
  if(!pi||!pi.rows){ toast('Gere a prévia primeiro','err'); return; }
  const idxs=[...pi.sel]; if(!idxs.length){ toast('Nenhuma linha selecionada','err'); return; }
  const recs=idxs.map(i=>{
    const r=pi.rows[i]; const ex=precoDe(r.pid,r.bitola); const padrao=variaveisPorMateria(r.mp);
    return { produto_id:r.pid, bitola:r.bitola, peso:r.peso,
      variavel_distribuidor: ex?ex.variavel_distribuidor:(padrao.dist||0),
      variavel_provedor: ex?ex.variavel_provedor:(padrao.prov||0),
      valor_distribuidor:r.vd, valor_provedor:r.vp,
      icms_flag:pi.regime, updated_by:(S.user&&S.user.email)||null };
  });
  const btn=$('#pi_apply'); if(btn){ btn.disabled=true; btn.textContent='Aplicando...'; }
  const CH=500; let done=0;
  for(let k=0;k<recs.length;k+=CH){
    const {error}=await sb.from('precificacoes').upsert(recs.slice(k,k+CH),{onConflict:'produto_id,bitola'});
    if(error){ toast('Erro ao aplicar: '+error.message,'err'); if(btn){btn.disabled=false;btn.textContent='Aplicar selecionados';} return; }
    done+=Math.min(CH,recs.length-k);
    if(btn) btn.textContent='Aplicando... '+done+'/'+recs.length;
  }
  await loadPrecos();
  toast(done+' produtos precificados','ok'); logAcao('precificacao_inteligente', done+' linhas · margem '+fmtN(pi.md,1)+'/'+fmtN(pi.mp,1)+'%');
  window._pi.rows=null; window._pi.sel=null; renderFormacao();
}

// retorna o par de variáveis padrão conforme a matéria prima do produto
function variaveisPorMateria(mp){
  const c=S.config||{};
  if(mp==='Aluminio') return {dist:c.var_dist_alu||0, prov:c.var_prov_alu||0};
  return {dist:c.var_dist_aco||0, prov:c.var_prov_aco||0}; // Aço (padrão)
}
// ---- PREÇO SUGERIDO ----
function margemAlvo(){ return margemAlvoCanal('distribuidor'); }
// Lucratividade-alvo por canal (distribuidor x provedor). Provedor cai para o valor de distribuidor se não configurado.
function margemAlvoCanal(canal){
  const c=S.config||{};
  if(canal==='provedor') return (Number(c.margem_alvo_prov_pct)||Number(c.margem_alvo_pct)||20)/100;
  return (Number(c.margem_alvo_pct)||20)/100;
}
function ratiosBaseConfig(){
  const c=S.config||{}; const fat=Number(c.faturamento_mes)||0;
  return { frFixo: fat>0?(Number(c.custos_fixos)||0)/fat:0,
           frVar:  fat>0?(Number(c.custos_variaveis)||0)/fat:0,
           comis:  (Number(c.comissao_pct)||0)/100 };
}
// Sugere um preço de venda que ENTREGA a margem-alvo como LUCRO LÍQUIDO (última linha).
// 1) custo MP + margem-alvo (prioritário). 2) fallback: Variável (R$/kg × peso) quando não há custo de MP cadastrado.
// canal: 'distribuidor'|'provedor' ; carga=fração impostos ; fidc=fração FIDC. Retorna {valor, base} ou null.
function precoSugerido(mp, bitola, peso, canal, carga, fidc, extraUnit, comisOverride, margemOverride){
  peso=Number(peso)||0; if(peso<=0) return null;
  const custoKg=custoKgMP(mp,bitola);
  if(custoKg!=null){
    const r=ratiosBaseConfig();
    const m=(margemOverride!=null && !isNaN(margemOverride)) ? Number(margemOverride) : margemAlvoCanal(canal);
    const comis = (comisOverride!=null) ? Number(comisOverride)||0 : r.comis;
    const denom = 1 - (r.frFixo+r.frVar+(fidc||0)+comis+(carga||0)) - m;
    // extraUnit = custo extra por unidade (ex.: rateio do frete CIF), somado ao custo antes de aplicar a margem
    if(denom>0.02) return {valor:((custoKg*peso)+(Number(extraUnit)||0))/denom, base:'margem '+fmtN(m*100,0)+'% '+(canal==='provedor'?'(prov)':'(dist)')+((Number(extraUnit)||0)>0?' + frete':'')};
  }
  // fallback: sem custo de MP cadastrado, usa a Variável de Precificação (não garante a margem-alvo)
  const pv=variaveisPorMateria(mp);
  const varKg = canal==='provedor' ? (Number(pv.prov)||0) : (Number(pv.dist)||0);
  if(varKg>0) return {valor:varKg*peso, base:'variável (sem custo MP p/ margem)'};
  return null;
}
// ---- Custo de Matéria-Prima ----
const MP_IMPOSTOS=[['icms','ICMS'],['ipi','IPI'],['pis','PIS'],['cofins','COFINS']];
// Mecânica tributária na compra:
//  - IPI é "por fora": não vem embutido no preço; quando incorpora, SOMA ao custo; quando credita, é neutro (recuperado).
//  - ICMS/PIS/COFINS são "por dentro": já embutidos no preço bruto; quando creditam, SUBTRAI (recupera); quando incorpora, é neutro (já está no preço).
const MP_POR_FORA={ipi:true, icms:false, pis:false, cofins:false};
function mpCustoLiquido(r){
  const b=brNum(r.preco_bruto); let fator=1;
  MP_IMPOSTOS.forEach(([k])=>{
    const pct=(Number(r[k+'_pct'])||0)/100; const credita=!!r[k+'_credita'];
    if(MP_POR_FORA[k]){ if(!credita) fator+=pct; }   // por fora: soma só se incorporar
    else { if(credita) fator-=pct; }                  // por dentro: subtrai só se creditar
  });
  return b*fator;
}
function normBit(s){ return String(s||'').toLowerCase().replace(/mm/g,'').replace(/\s/g,'').replace('.',',').trim(); }
function custoKgMP(material, bitola){
  const nb=normBit(bitola);
  const row=(S.mpcustos||[]).find(r=>r.material===material && normBit(r.bitola)===nb);
  return row? mpCustoLiquido(row) : null;
}

async function saveMP(){

  const chaves=new Set();
  for(const r of rows){ const k=r.material+'|'+normBit(r.bitola); if(chaves.has(k)){ toast('Bitola repetida em '+(r.material==='Aluminio'?'Alumínio':'Aço')+': '+r.bitola,'err'); return; } chaves.add(k); }

    updated_by:S.user.email }));

const UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RO','RR','RS','SC','SP','SE','TO'];
const UF_SUL_SUDESTE=['SP','RJ','MG','PR','SC','RS']; // origem que aplica 7% p/ N/NE/CO/ES
const UF_N_NE_CO_ES=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','PA','PB','PE','PI','RN','RO','RR','SE','TO'];
// Resolve o código de ICMS da proposta: '7' | '12' | '18' | 'interno' | 'simples' | null
function icmsProposta(clienteUF, regime){
  if(regime && regime!=='auto') return regime;             // manual
  const org=((S.config||{}).uf_origem||'').toUpperCase();
  const dst=(clienteUF||'').toUpperCase();
  if(!org || !dst) return null;
  if(dst===org) return 'interno';
  if(UF_SUL_SUDESTE.includes(org) && UF_N_NE_CO_ES.includes(dst)) return '7';
  return '12';
}
function cargaProposta(cod){
  const c=S.config||{};
  if(cod==='exportacao') return {icms:0, carga:0, tipo:'Exportação (isento de impostos)'};
  if(cod==='semnota') return {icms:0, carga:0, tipo:'Sem nota (sem impostos)'};
  if(cod==='simples') return {icms:6, carga:0.06, tipo:'Simples Nacional'};
  const icms = cod==='interno' ? (Number(c.icms_interno)||18) : Number(cod);
  return {icms, carga:(icms+9.25)/100, tipo: cod==='interno' ? 'ICMS interno '+icms+'%' : 'ICMS '+icms+'%'};
}
// FIDC conforme condição de pagamento (parcelas): 1-4x=4,5% ; 5x=5,10% ; 6x=5,5% ; acima=manual
function fidcParcela(parcelas, manual){
  const p=String(parcelas||'1');
  if(p==='manual') return Number(manual)||0;
  if(p==='5') return 5.10;
  if(p==='6') return 5.50;
  return 4.50; // 1x a 4x
}
function calcProposta(prop){
  const c=S.config||{};
  const fat=Number(c.faturamento_mes)||0;
  const frFixo=fat>0?(Number(c.custos_fixos)||0)/fat:0;
  const frVar =fat>0?(Number(c.custos_variaveis)||0)/fat:0;
  const fidcPct=fidcParcela(prop.parcelas, prop.fidcManual)/100;
  const comisPct=comissaoPropostaFrac(prop);
  const ipiPct=(Number(prop.ipiPct)||0)/100;
  const icmsCod=icmsProposta(prop.cliente_uf, prop.regime);
  const cg=icmsCod?cargaProposta(icmsCod):null;
  const carga=cg?cg.carga:0;
  const frete=Number(prop.frete)||0;
  const redespacho=Number(prop.redespacho)||0;
  const extras=(prop.extras||[]).reduce((s,e)=>s+(Number(e.valor)||0),0);
  const custosExtras=frete+redespacho+extras;
  let recTot=0, mpTot=0;
  const itens=(prop.itens||[]).map(it=>{
    const qtd=Number(it.qtd)||0, preco=Number(it.preco)||0, peso=Number(it.peso)||0;
    const receita=preco*qtd;
    const custoKg=custoKgMP(it.materia_prima, it.bitola);
    const mp=custoKg!=null?custoKg*peso*qtd:0;
    recTot+=receita; mpTot+=mp;
    return {...it, receita, mp, custoKg};
  });
  const fixo=recTot*frFixo, varc=recTot*frVar, fidc=recTot*fidcPct, comis=recTot*comisPct, imp=recTot*carga;
  const ipiVal=recTot*ipiPct;                 // IPI destacado (não reduz o lucro; soma na nota)
  const totalNota=recTot+ipiVal;
  const lucro=recTot-fixo-varc-fidc-comis-imp-mpTot-custosExtras;
  const lucroPct=recTot>0?lucro/recTot*100:0;
  const itensCalc=itens.map(it=>{
    const share=recTot>0?it.receita/recTot:0;
    const li=it.receita - it.receita*(frFixo+frVar+fidcPct+comisPct+carga) - it.mp - custosExtras*share;
    return {...it, lucro:li, lucroPct: it.receita>0?li/it.receita*100:0};
  });
  return {icmsCod,cg,recTot,fixo,varc,fidc,comis,imp,mpTot,frete,redespacho,extras,custosExtras,ipiPct,ipiVal,totalNota,lucro,lucroPct,itens:itensCalc,
    ratios:{frFixo,frVar,fidcPct,comisPct,carga}};
}

// Comissão (fração) da proposta: usa o valor editado na proposta; se em branco, cai no padrão da config
function comissaoPropostaFrac(prop){
  prop=prop||S.propostaEdit||{}; const c=S.config||{};
  const v=(prop.comissaoPct!=null && prop.comissaoPct!=='') ? Number(prop.comissaoPct) : (Number(c.comissao_pct)||0);
  return (Number(v)||0)/100;
}
// Soma dos custos extras do pedido (frete CIF + redespacho + extras)
function custosExtrasProposta(){
  const p=S.propostaEdit||{};
  return (Number(p.frete)||0)+(Number(p.redespacho)||0)+((p.extras||[]).reduce((s,e)=>s+(Number(e.valor)||0),0));
}
// Rateio do frete/custos extras por UNIDADE do item (proporcional ao peso; se sem peso, por quantidade)
function freteUnitItem(it){
  const ce=custosExtrasProposta(); if(ce<=0) return 0;
  const itens=(S.propostaEdit&&S.propostaEdit.itens)||[];
  let totPeso=0, totQtd=0;
  itens.forEach(x=>{ totPeso+=(Number(x.peso)||0)*(Number(x.qtd)||0); totQtd+=(Number(x.qtd)||0); });
  if(totPeso>0) return ce*(Number(it.peso)||0)/totPeso;   // por unidade (rateio por peso)
  return totQtd>0 ? ce/totQtd : 0;                         // fallback: por quantidade
}
function sugestaoItem(it){
  const cf=cargaFidcProposta();
  return precoSugerido(it.materia_prima, it.bitola, it.peso, (S.propostaEdit.canal||'distribuidor'), cf.carga, cf.fidc, freteUnitItem(it), comissaoPropostaFrac());

function normDesc(s){ return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,' ').trim(); }
// SKU = começa com letra e tem pelo menos 2 dígitos (TGLP007, SYMMEO013, TGLF071...)
const RE_ITEM_PED=/^(.+?)\s+([A-Z][A-Z0-9]*[0-9]{2,}[A-Z0-9]*)\s+([\d.]+,\d{2})\s+([A-Za-z]{1,4})\s+([\d.]+,\d{2,4})\s+([\d.]+,\d{2})$/;
async function extractPdfText(arrayBuffer){
  if(!window.pdfjsLib) throw new Error('Leitor de PDF não carregou. Recarregue a página e tente de novo.');
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let full='';
  for(let pn=1; pn<=pdf.numPages; pn++){
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    const rows={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      let key=Object.keys(rows).find(k=>Math.abs(Number(k)-y)<=2);
      if(key==null) key=y;
      (rows[key]=rows[key]||[]).push({x:it.transform[4], s:it.str});
    });
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      let line=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      // cola números que o PDF quebrou ao redor de . ou , (ex: "1.140 ,00" -> "1.140,00")
      line=line.replace(/(\d)\s+([.,])/g,'$1$2').replace(/([.,])\s+(\d)/g,'$1$2');
      if(line) full+=line+'\n';
    });
  }
  return full;
}
function parsePedido(txt){
  const linhas=txt.split('\n');
  const tipo=/Proposta Comercial/i.test(txt)?'proposta':'pedido';
  let numero=''; const mN=txt.match(/(?:Pedido de Venda|Proposta Comercial)\s*N[ºo°º]?\s*(\d+)/i); if(mN) numero=mN[1];
  // UF: CEP seguido de ", UF" (aceita "- Cidade, UF")
  let cliente_uf=''; const mU=txt.match(/\d{2}\.?\d{3}-?\d{3}[^\n]*?,\s*([A-Z]{2})\b/);
  if(mU && UFS.includes(mU[1])) cliente_uf=mU[1];
  // Cliente: 1ª linha não vazia depois do "Nº <numero>" (pula "Para"/"Cliente")
  let cliente='';
  const idxN=linhas.findIndex(l=>/(Pedido de Venda|Proposta Comercial)\s*N/i.test(l));
  if(idxN>=0){ for(let j=idxN+1;j<Math.min(idxN+4,linhas.length);j++){ const l=linhas[j].trim();
    if(l && !/^(Para|Cliente|Endereço)/i.test(l)){ cliente=l; break; } } }
  // Itens
  const itens=[];
  linhas.forEach(l=>{
    const m=l.trim().match(RE_ITEM_PED);
    if(m){
      const desc=m[1].trim(), sku=m[2], qtd=brNum(m[3]), preco=brNum(m[5]), total=brNum(m[6]);
      if(qtd>0 && preco>0){ const mt=matchImport(sku,desc); itens.push({sku,desc,qtd,preco,total,match:mt}); }
    }
  });
  return {tipo,numero,cliente,cliente_uf,itens};
}
function matchImport(sku,desc){
  const prods=S.produtos||[];
  const s=String(sku||'').toUpperCase().trim();
  let p=prods.find(x=>String(x.codigo||'').toUpperCase().trim()===s);
  if(p) return {p,via:'código'};
  const nd=normDesc(desc);
  if(nd){
    p=prods.find(x=>normDesc(x.descricao)===nd); if(p) return {p,via:'descrição'};
    p=prods.find(x=>{const xd=normDesc(x.descricao); return xd&&(xd.includes(nd)||nd.includes(xd));}); if(p) return {p,via:'descrição~'};
  }
  return {p:null,via:null};
}
async function lerPdfImport(file){
  if(!file) return;
  const box=$('#impStatus'); if(box) box.innerHTML='<div class="hint">Lendo PDF…</div>';
  try{
    const buf=await file.arrayBuffer();
    const txt=await extractPdfText(buf);
    const d=parsePedido(txt);
    d.arquivo=file.name;
    S.importData=d;
    renderImportar();
    if(!d.itens.length) toast('Nenhum item reconhecido no PDF. Confira se é um pedido/proposta da TGL.','err');
  }catch(e){ if(box) box.innerHTML='<div class="hint" style="color:var(--vermelho)">Erro ao ler PDF: '+esc(e.message)+'</div>'; }
}
function impSetUF(v){ if(S.importData) S.importData.cliente_uf=v; }
function importarParaMargem(){
  const d=S.importData; if(!d) return;
  const itens=d.itens.filter(it=>it.match&&it.match.p).map(it=>{
    const p=it.match.p; const bit=bitolaPrincipal(p)||'';
    const pesos=Array.isArray(p.pesos)?p.pesos:[];
    const peso=(pesos.find(x=>normBit(x.bitola)===normBit(bit))||{}).peso ?? '';
    return {produto_id:p.id, codigo:p.codigo, descricao:p.descricao, materia_prima:p.materia_prima,
      bitola:bit, qtd:it.qtd, peso, preco:it.preco};
  });
  if(!itens.length){ toast('Nenhum item casado com o cadastro para importar','err'); return; }
  S.propostaEdit={id:null, numero:d.numero||'', cliente:d.cliente||'', cliente_uf:d.cliente_uf||'', regime:'auto',
    canal:'distribuidor', obs:'Importado de '+(d.tipo==='proposta'?'proposta':'pedido')+' '+(d.numero||'')+' ('+(d.arquivo||'')+')',
    frete:0, redespacho:0, ipiPct:0, parcelas:'1', fidcManual:0, extras:[], itens};
  S.importData=null;
  toast('Importado — ajuste os preços e veja a margem','ok'); logAcao('import_pedido', d.numero||'');
  go('propostas');
}
function renderImportar(){
  const d=S.importData;
  const semProd=!(S.produtos&&S.produtos.length);
  let preview='';
  if(d){
    const casados=d.itens.filter(it=>it.match&&it.match.p).length;
    const naoCasados=d.itens.length-casados;
    const badge=(it)=>{ if(!it.match||!it.match.p) return '<span class="tag no">não encontrado</span>';
      const v=it.match.via; return '<span class="tag ok">'+ (v==='código'?'✓ código':(v==='descrição'?'✓ descrição':'≈ descrição'))+'</span>'; };
    const rows=d.itens.map(it=>`<tr>
      <td>${esc(it.desc)}<br><small style="color:var(--muted)">SKU: ${esc(it.sku)}</small></td>
      <td class="num">${fmtN(it.qtd,0)}</td>
      <td class="num">${fmtBRL(it.preco)}</td>
      <td>${badge(it)}${it.match&&it.match.p?`<br><small style="color:var(--muted)">→ ${esc(it.match.p.codigo)} ${esc((it.match.p.descricao||'').slice(0,34))}</small>`:''}</td>
    </tr>`).join('');
    preview=`
      <div class="card">
        <div class="grid g3">
          <div class="fld"><label>Tipo</label><input value="${esc(d.tipo==='proposta'?'Proposta Comercial':'Pedido de Venda')}" disabled></div>
          <div class="fld"><label>Nº</label><input value="${esc(d.numero||'')}" oninput="S.importData.numero=this.value"></div>
          <div class="fld"><label>Estado do cliente (UF)</label>
            <select onchange="impSetUF(this.value)"><option value="">— selecione —</option>
              ${UFS.map(u=>`<option ${d.cliente_uf===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div class="fld" style="grid-column:span 3"><label>Cliente</label><input value="${esc(d.cliente||'')}" oninput="S.importData.cliente=this.value"></div>
        </div>
        <div class="hint" style="margin:6px 0 10px">${d.itens.length} item(ns) lidos — <b style="color:var(--verde)">${casados} casado(s)</b>${naoCasados?` · <b style="color:var(--vermelho)">${naoCasados} sem cadastro</b> (não entram na margem; cadastre e reimporte, ou ajuste na tela de margem)`:''}.</div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Item do PDF</th><th class="num">Qtd</th><th class="num">Preço un.</th><th>Cadastro</th></tr></thead>
          <tbody>${rows||`<tr><td colspan="4"><div class="empty">Nenhum item reconhecido.</div></td></tr>`}</tbody>
        </table></div>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn sm" onclick="importarParaMargem()" ${casados?'':'disabled'}>Abrir na tela de margem →</button>
          <button class="btn ghost sm" onclick="S.importData=null;renderImportar()">Limpar</button>
        </div>
      </div>`;
  }
  $('#view').innerHTML=`
    <div class="page-head"><h2>Importar Pedido / Proposta</h2></div>
    <div class="card">
      <p style="margin:0 0 10px;color:var(--muted);font-size:13.5px">Envie um PDF de <b>Pedido de Venda</b> ou <b>Proposta Comercial</b> da TGL. O sistema lê os itens, casa cada um com o cadastro (pelo código; se não achar, pela descrição) e leva tudo para a tela de margem — com peso e custo já preenchidos — para você ajustar os preços e ver a lucratividade.</p>
      ${semProd?`<div class="hint" style="color:var(--vermelho)">⚠ Cadastro de produtos vazio. Carregue os produtos antes de importar.</div>`:''}
      <label class="btn sm" style="display:inline-block;cursor:pointer">Escolher PDF…
        <input type="file" id="pdfImport" accept="application/pdf" style="display:none" onchange="lerPdfImport(this.files[0])"></label>
      <div id="impStatus" style="margin-top:8px"></div>
    </div>
    ${preview}`;
}

    <div class="card">
      <h3 style="margin:0 0 4px">Dados fiscais da empresa</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Usados no ICMS automático das Propostas. O ICMS interestadual é calculado a partir da UF de origem: mesma UF = ICMS interno; Sul/Sudeste → Norte/Nordeste/Centro-Oeste/ES = 7%; demais = 12%.</p>
      <div class="grid g3">
        <div class="fld"><label>UF de origem (de onde sai a mercadoria)</label>
          <select id="uforigem">
            <option value="">— selecione —</option>
            ${UFS.map(u=>`<option ${c.uf_origem===u?'selected':''}>${u}</option>`).join('')}
          </select></div>
        <div class="fld"><label>ICMS interno (%) — vendas no mesmo estado</label><input id="icmsint" type="number" step="0.01" value="${c.icms_interno??18}"></div>
        <div class="fld"><label>Margem-alvo Distribuidor (%)</label><input id="margemalvo" type="number" step="0.01" value="${c.margem_alvo_pct??20}"></div>
        <div class="fld"><label>Margem-alvo Provedor (%)</label><input id="margemalvoprov" type="number" step="0.01" value="${c.margem_alvo_prov_pct??(c.margem_alvo_pct??20)}"></div>
      </div>
      <p style="margin:8px 0 0;color:var(--muted);font-size:12.5px">As margens-alvo são usadas para sugerir o preço quando não há Variável de Precificação cadastrada (preço = custo da MP + demais custos, mirando essa margem de lucro sobre a venda). Distribuidor e Provedor podem ter lucratividades desejadas diferentes.</p>
      <div style="margin-top:16px"><button class="btn sm" onclick="saveFiscal()">Salvar dados fiscais</button></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 4px">Descontos por tipo de cliente</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Desconto (%) aplicado sobre toda a Tabela de Preços. ICMS 18% normalmente fica em 0 (valor cheio).</p>
      <div class="grid g3">
        <div class="fld"><label>ICMS 18% (valor cheio)</label><input id="d18" type="number" step="0.01" value="${c.desc_icms18??0}"></div>
        <div class="fld"><label>ICMS 12% — desconto %</label><input id="d12" type="number" step="0.01" value="${c.desc_icms12??0}"></div>
        <div class="fld"><label>ICMS 7% — desconto %</label><input id="d7" type="number" step="0.01" value="${c.desc_icms7??0}"></div>
        <div class="fld"><label>Simples Nacional — desconto %</label><input id="ds" type="number" step="0.01" value="${c.desc_simples??0}"></div>
      </div>
      <div style="margin-top:16px"><button class="btn sm" onclick="saveDescontos()">Salvar descontos</button></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center"><h3 style="margin:0">Usuários</h3><div class="spacer" style="flex:1"></div>
        <button class="btn sm" onclick="openNovoUsuario()">+ Novo usuário</button></div>
      <div id="usersBox" style="margin-top:12px"><div class="empty">Carregando...</div></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Log de atividades</h3>
      <div id="logsBox"><div class="empty">Carregando...</div></div>
    </div>`;
  loadUsers(); loadLogs();
}
async function saveDescontos(){
  const rec={ desc_icms18:parseFloat($('#d18').value)||0, desc_icms12:parseFloat($('#d12').value)||0,
    desc_icms7:parseFloat($('#d7').value)||0, desc_simples:parseFloat($('#ds').value)||0 };
  const {error}=await sb.from('configuracoes').update(rec).eq('id',1);
  if(error){ toast('Erro ao salvar','err'); return; }
  await loadConfig(); toast('Descontos atualizados','ok'); logAcao('config_descontos');
}
async function saveFiscal(){
  const rec={ uf_origem: $('#uforigem').value || null, icms_interno: parseFloat($('#icmsint').value)||0,
    margem_alvo_pct: parseFloat($('#margemalvo').value)||0,
    margem_alvo_prov_pct: parseFloat($('#margemalvoprov').value)||0 };
  const {error}=await sb.from('configuracoes').update(rec).eq('id',1);
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  await loadConfig(); toast('Dados fiscais atualizados','ok'); logAcao('config_fiscal');
}
async function loadUsers(){
  const {data,error}=await sb.from('perfis').select('*').order('created_at');
  const box=$('#usersBox'); if(!box) return;
  if(error){ box.innerHTML=`<div class="empty">Não foi possível listar usuários.</div>`; return; }
  box.innerHTML=`<table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Desde</th></tr></thead>
    <tbody>${(data||[]).map(u=>`<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email)}</td>
      <td><span class="tag ${u.papel==='admin'?'alu':'aco'}">${esc(u.papel||'usuario')}</span></td>
      <td>${new Date(u.created_at).toLocaleDateString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Nenhum usuário.</div></td></tr>'}</tbody></table>`;
}
async function loadLogs(){
  const {data}=await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(60);
  const box=$('#logsBox'); if(!box) return;
  box.innerHTML=`<table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead>
    <tbody>${(data||[]).map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('pt-BR')}</td>
      <td>${esc(l.user_email||'—')}</td><td>${esc(l.acao||'')}</td><td>${esc(l.detalhe||'')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Sem registros.</div></td></tr>'}</tbody></table>`;
}
function openNovoUsuario(){
  modal('Novo usuário', `
    <div class="grid">
      <div class="fld"><label>Nome</label><input id="u_nome"></div>
      <div class="fld"><label>E-mail <span class="req">*</span></label><input id="u_email" type="email"></div>
      <div class="fld"><label>Senha <span class="req">*</span></label><input id="u_pass" type="password"></div>
      <div class="fld"><label>Papel</label><select id="u_papel"><option value="usuario">Usuário</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="hint">O usuário é criado no Supabase Auth. Se a confirmação de e-mail estiver ativada no projeto, ele precisará confirmar antes de entrar.</div>
  `, [
    {txt:'Cancelar',cls:'ghost',fn:closeModal},
    {txt:'Criar usuário',cls:'',fn:criarUsuario}
  ]);
}
async function criarUsuario(){
  const nome=$('#u_nome').value.trim(), email=$('#u_email').value.trim(), password=$('#u_pass').value, papel=$('#u_papel').value;
  if(!email||!password){ toast('E-mail e senha obrigatórios','err'); return; }
  // cliente temporário para NÃO trocar a sessão do admin logado
  const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data,error}=await tmp.auth.signUp({email,password,options:{data:{nome}}});
  if(error){ toast('Erro ao criar: '+error.message,'err'); return; }
  // define papel no perfil (o gatilho já criou a linha)
  if(data.user){ await sb.from('perfis').update({nome,papel}).eq('id',data.user.id); }
  closeModal(); loadUsers(); toast('Usuário criado','ok'); logAcao('novo_usuario',email);
}

/* ============================================================
   MODAL / CONFIRM
   ============================================================ */
function modal(titulo, body, botoes){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="m-head"><h3>${esc(titulo)}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="m-body">${body}</div>
    <div class="m-foot">${botoes.map((b,i)=>`<button class="btn ${b.cls} sm" id="mb_${i}">${esc(b.txt)}</button>`).join('')}</div>
    </div></div>`;
  botoes.forEach((b,i)=>$('#mb_'+i).onclick=b.fn);
  // marca campos de valor final como "tocados" ao editar
  ['p_rd','p_rp'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('keyup',()=>el.dataset.touched='1');});
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmBox(html, onOk){
  modal('Confirmar', `<div style="font-size:14.5px;line-height:1.5">${html}</div>`, [
    {txt:'Cancelar',cls:'ghost',fn:closeModal},
    {txt:'Confirmar',cls:'danger',fn:onOk}
  ]);
}

/* ============================================================
   INICIALIZAÇÃO — mantém sessão
   ============================================================ */
(async function init(){
  if(!sb){
    $('#loginMsg').className='msg err';
    $('#loginMsg').textContent='Não foi possível carregar a biblioteca do Supabase. Verifique a conexão e recarregue.';
    return;
  }
  if(SUPABASE_URL.startsWith('COLE_AQUI')){
    $('#loginMsg').className='msg err';
    $('#loginMsg').textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html.';
  }
  const {data}=await sb.auth.getSession();
  if(data?.session){ S.user=data.session.user; await startApp(); }
})();
</script>
