<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PreforCoast — Precificação de Alças Preformadas</title>

<!-- ============================================================ -->
<!--  Cliente Supabase                                             -->
<!-- ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --azul:#0d4f8b; --azul-2:#1567b8; --azul-claro:#e8f1fb;
    --cinza:#f4f6f9; --borda:#d8dee6; --texto:#1c2733; --muted:#67727e;
    --verde:#1a9b56; --vermelho:#d0433b; --amarelo:#d9a300;
    --sombra:0 1px 3px rgba(16,32,53,.08),0 4px 16px rgba(16,32,53,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--cinza);color:var(--texto);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px}
  .hidden{display:none !important}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,var(--azul) 0%,#083a68 100%)}
  .login-card{background:#fff;border-radius:14px;padding:38px 34px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
  .brand .logo{width:38px;height:38px;border-radius:9px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
  .brand h1{font-size:22px;margin:0;color:var(--azul);letter-spacing:-.5px}
  .login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin:0 0 22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:8px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--azul-2);box-shadow:0 0 0 3px var(--azul-claro)}
  .btn{background:var(--azul);color:#fff;border:none;padding:11px 16px;border-radius:8px;font-weight:600;width:100%}
  .btn:hover{background:var(--azul-2)}
  .btn.sec{background:#fff;color:var(--azul);border:1px solid var(--borda);width:auto;padding:8px 14px}
  .btn.sec:hover{background:var(--azul-claro)}
  .btn.sm{width:auto;padding:7px 12px;font-size:13px}
  .btn.danger{background:var(--vermelho)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--borda);width:auto;padding:7px 12px}
  .msg{font-size:12.5px;margin-top:10px;text-align:center;min-height:16px}
  .msg.err{color:var(--vermelho)} .msg.ok{color:var(--verde)}

  /* ---------- Shell ---------- */
  #app{display:flex;flex-direction:column;min-height:100vh}
  header.top{background:var(--azul);color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;box-shadow:var(--sombra);position:sticky;top:0;z-index:20}
  header .logo{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:800;margin-right:9px}
  header .title{font-weight:700;font-size:17px;letter-spacing:-.3px}
  nav.menu{display:flex;gap:4px;margin-left:26px;flex:1}
  nav.menu a{color:#cfe0f2;text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13.5px}
  nav.menu a:hover{background:rgba(255,255,255,.12);color:#fff}
  nav.menu a.active{background:#fff;color:var(--azul)}
  .user-box{display:flex;align-items:center;gap:12px;font-size:13px}
  .user-box .email{color:#dbe8f6}
  main{padding:22px;max-width:1180px;margin:0 auto;width:100%}

  .card{background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--sombra);padding:18px 20px;margin-bottom:18px}
  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .page-head h2{margin:0;font-size:20px;letter-spacing:-.4px}
  .spacer{flex:1}
  .search{position:relative}
  .search input{padding:9px 12px 9px 34px;border:1px solid var(--borda);border-radius:8px;width:260px;outline:none}
  .search input:focus{border-color:var(--azul-2);box-shadow:0 0 0 3px var(--azul-claro)}
  .search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--borda);white-space:nowrap}
  td{padding:11px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle}
  tr:hover td{background:#fafbfd}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .tag.aco{background:#eef1f5;color:#4a5560}
  .tag.alu{background:var(--azul-claro);color:var(--azul)}
  .tag.ok{background:#e4f6ec;color:var(--verde)}
  .tag.no{background:#fdecea;color:var(--vermelho)}
  .empty{text-align:center;color:var(--muted);padding:34px 0;font-size:13.5px}
  .row-actions button{border:1px solid var(--borda);background:#fff;border-radius:7px;padding:5px 9px;margin-left:5px;color:var(--azul)}
  .row-actions button:hover{background:var(--azul-claro)}
  .row-actions button.del{color:var(--vermelho)}
  .row-actions button.del:hover{background:#fdecea}

  /* client type pills */
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:7px 13px;border:1px solid var(--borda);border-radius:20px;background:#fff;font-size:13px;font-weight:600;color:var(--muted)}
  .pill.active{background:var(--azul);color:#fff;border-color:var(--azul)}

  /* sub tabs */
  .subtabs{display:flex;gap:4px;border-bottom:1px solid var(--borda);margin-bottom:18px}
  .subtabs button{background:none;border:none;padding:11px 16px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .subtabs button.active{color:var(--azul);border-bottom-color:var(--azul)}

  /* forms */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:600;color:var(--muted)}
  .fld .req{color:var(--vermelho)}
  .fld input,.fld select{padding:9px 11px;border:1px solid var(--borda);border-radius:8px;outline:none;width:100%}
  .fld input:focus,.fld select:focus{border-color:var(--azul-2);box-shadow:0 0 0 3px var(--azul-claro)}
  .fld input[readonly]{background:#f4f6f9;color:#5b6672}
  .auto-flag{font-size:10.5px;color:var(--verde);font-weight:700}
  .auto-flag.warn{color:var(--amarelo)}
  .inline-prefix{position:relative}
  .inline-prefix span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
  .inline-prefix input{padding-left:32px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(16,28,44,.5);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:50;overflow:auto}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .modal .m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--borda)}
  .modal .m-head h3{margin:0;font-size:17px}
  .modal .m-body{padding:20px;max-height:70vh;overflow:auto}
  .modal .m-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--borda)}
  .x{margin-left:auto;background:none;border:none;font-size:20px;color:var(--muted);line-height:1}

  /* peso mini table */
  .pesos-tbl{width:100%;border:1px solid var(--borda);border-radius:8px;overflow:hidden;margin-top:6px}
  .pesos-tbl .ph{display:grid;grid-template-columns:1fr 1fr 40px;background:var(--cinza);padding:7px 10px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .pesos-tbl .pr{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;padding:7px 10px;align-items:center;border-top:1px solid #eef1f5}
  .pesos-tbl .pr input{padding:7px 9px;border:1px solid var(--borda);border-radius:6px;width:100%}
  .pesos-tbl .pr button{border:none;background:#fdecea;color:var(--vermelho);border-radius:6px;padding:6px}

  .breakdown{background:var(--azul-claro);border:1px solid #cfe0f2;border-radius:10px;padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.55}
  .breakdown b{color:var(--azul)}
  .breakdown .lin{display:flex;justify-content:space-between;padding:3px 0}
  .breakdown .lin.total{border-top:1px dashed #a9c7e6;margin-top:6px;padding-top:8px;font-weight:700}

  .stat{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:14px 16px}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600}
  .stat .val{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.5px}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--texto);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:80;font-size:13.5px;opacity:0;transform:translateY(10px);transition:.25s}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.err{background:var(--vermelho)} .toast.ok{background:var(--verde)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  @media(max-width:720px){.grid,.grid.g3{grid-template-columns:1fr}nav.menu{overflow:auto}}
</style>
</head>
<body>

<!-- ============================================================ -->
<!--  TELA DE LOGIN                                                -->
<!-- ============================================================ -->
<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="brand"><div class="logo">PC</div><h1>PreforCoast</h1></div>
    <p class="login-sub">Sistema de precificação de Alças Preformadas</p>
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" autocomplete="username" required /></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" required /></div>
    <button class="btn" type="submit" id="loginBtn">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</div>

<!-- ============================================================ -->
<!--  APLICAÇÃO                                                    -->
<!-- ============================================================ -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo">PC</div><div class="title">PreforCoast</div>
    <nav class="menu">
      <a href="#" data-sec="cadastros" onclick="go('cadastros',event)">Cadastros</a>
      <a href="#" data-sec="tabela" onclick="go('tabela',event)">Tabela de Preço</a>
      <a href="#" data-sec="formacao" onclick="go('formacao',event)">Formação de Preços</a>
      <a href="#" data-sec="config" onclick="go('config',event)">Configurações</a>
    </nav>
    <div class="user-box">
      <span class="email" id="userEmail"></span>
      <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" onclick="doLogout()">Sair</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO  —  PREENCHA COM OS DADOS DO SEU PROJETO SUPABASE
   (Painel Supabase > Project Settings > API)
   ============================================================ */
const SUPABASE_URL      = "https://mgnhecuyuxqoquuukatx.supabase.co";      // ex: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nbmhlY3V5dXhxb3F1dXVrYXR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MzI1ODEsImV4cCI6MjEwMjMwODU4MX0.mhGnLZ1aqsboD9V9l61h1oa6O0LsduPt7a9CX4AfMTA";   // chave "anon public"
/* ============================================================ */

let sb = null;
if (window.supabase) sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- Estado ---------------- */
const S = {
  user:null, produtos:[], precos:{}, config:null,
  clientType:'18', formSub:'precificar', search:{cadastros:'',tabela:'',precificar:''}
};

/* ---------------- Helpers ---------------- */
const $  = (s,r=document)=>r.querySelector(s);
const esc = t => (t==null?'':String(t)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function brNum(v){ // converte string BR ("1.234,56" ou "6,80") em número
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  let s=String(v).trim().replace(/[^\d.,-]/g,'');
  if(s.includes('.')&&s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const fmtBRL = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN   = (n,d=2)=> (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function maskBRL(el){ let v=el.value.replace(/\D/g,''); el.value=(parseInt(v||'0',10)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg,type=''){ const t=$('#toast'); t.textContent=msg; t.className='toast show '+type; setTimeout(()=>t.className='toast',2600); }
async function logAcao(acao,detalhe=''){ try{ await sb.from('logs').insert({user_email:S.user?.email,acao,detalhe}); }catch(e){} }

/* ---------------- Parser de descrição ---------------- */
const CORES=['BRANCO','PRETO','AZUL','VERMELHO','VERDE','AMARELO','LARANJA','MARROM','CINZA','ROSA','ROXO','VIOLETA','BEGE'];
function parseDescricao(nome){
  const s=(nome||'').toUpperCase();
  const o={tipo:null,materia_prima:null,range_min:null,range_max:null,cor:null,comprimento:null,qtd_varetas:null,alertas:[]};
  if(/AL[ÇC]A|ALCA/.test(s)) o.tipo='ALÇA PREFORMADA';
  else if(/LA[ÇC]O/.test(s)) o.tipo='LAÇO PREFORMADO';
  else if(/DERIVA/.test(s)) o.tipo='DERIVAÇÃO';
  else if(/EMENDA/.test(s)) o.tipo='EMENDA';
  else o.alertas.push('Tipo');
  if(/AL\s+CABO\s+OPTICO/.test(s)) o.materia_prima='Aluminio';
  else if(/AC\s+CCE/.test(s)) o.materia_prima='Aco';
  else if(/\bAL\b/.test(s)) o.materia_prima='Aluminio';
  else if(/\bAC\b/.test(s)) o.materia_prima='Aco';
  else o.alertas.push('Matéria Prima');
  const r=s.match(/(\d+[,.]\d+)\s*[-–]\s*(\d+[,.]\d+)\s*MM/);
  if(r){ o.range_min=brNum(r[1]); o.range_max=brNum(r[2]); } else o.alertas.push('Range');
  const semRange = r ? s.replace(r[0],' ') : s;
  const c=semRange.match(/(\d{2,4})\s*MM/);
  if(c) o.comprimento=parseInt(c[1],10); else o.alertas.push('Comprimento');
  const v=s.match(/(\d+)\s*V\b/);
  if(v) o.qtd_varetas=parseInt(v[1],10); else o.alertas.push('Varetas');
  for(const cor of CORES){ if(new RegExp('\\b'+cor+'\\b').test(s)){ o.cor=cor; break; } }
  if(!o.cor) o.alertas.push('Cor');
  return o;
}

/* ============================================================
   AUTENTICAÇÃO
   ============================================================ */
async function doLogin(e){
  e.preventDefault();
  const msg=$('#loginMsg'); const btn=$('#loginBtn');
  msg.className='msg'; msg.textContent=''; btn.disabled=true; btn.textContent='Entrando...';
  const email=$('#loginEmail').value.trim(), password=$('#loginPass').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false; btn.textContent='Entrar';
  if(error){ msg.className='msg err'; msg.textContent='Não foi possível entrar: '+error.message; return false; }
  S.user=data.user; await startApp(); logAcao('login'); return false;
}
async function doLogout(){ await logAcao('logout'); await sb.auth.signOut(); location.reload(); }

async function startApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#userEmail').textContent=S.user.email;
  await loadAll();
  go('cadastros');
}

/* ============================================================
   CARGA DE DADOS
   ============================================================ */
async function loadAll(){
  await Promise.all([loadProdutos(), loadPrecos(), loadConfig(), loadMP()]);
}
async function loadMP(){
  const {data,error}=await sb.from('materia_prima_custos').select('*').order('material').order('bitola');
  if(error){ S.mpcustos=[]; return; }
  S.mpcustos=data||[];
}
async function loadProdutos(){
  const {data,error}=await sb.from('produtos').select('*').order('descricao');
  if(error){ toast('Erro ao carregar produtos','err'); return; }
  S.produtos=data||[];
}
async function loadPrecos(){
  const {data,error}=await sb.from('precificacoes').select('*');
  if(error) return;
  S.precos={}; S.precosArr=data||[];
  (data||[]).forEach(p=>{ S.precos[chavePreco(p.produto_id,p.bitola)]=p; });
}
// chave única de precificação por produto + bitola
function chavePreco(pid, bitola){ return pid+'::'+normBit(bitola); }
function precoDe(pid, bitola){ return S.precos[chavePreco(pid,bitola)]; }
function precosDoProduto(pid){ return (S.precosArr||[]).filter(p=>p.produto_id===pid); }
function matLabel(mp){ return mp==='Aluminio'?'Alumínio':(mp==='Aco'?'Aço':'—'); }
function matTag(mp){ return mp==='Aluminio'?'<span class="tag alu">Alumínio</span>':(mp==='Aco'?'<span class="tag aco">Aço</span>':'—'); }
async function loadConfig(){
  const {data}=await sb.from('configuracoes').select('*').eq('id',1).single();
  S.config=data||{};
}

/* ============================================================
   ROTEADOR
   ============================================================ */
function go(sec,e){
  if(e) e.preventDefault();
  document.querySelectorAll('nav.menu a').forEach(a=>a.classList.toggle('active',a.dataset.sec===sec));
  if(sec==='cadastros') renderCadastros();
  else if(sec==='tabela') renderTabela();
  else if(sec==='formacao') renderFormacao();
  else if(sec==='config') renderConfig();
}

/* ============================================================
   TELA: CADASTROS
   ============================================================ */
function renderCadastros(){
  const q=S.search.cadastros.toLowerCase();
  const list=S.produtos.filter(p=>!q||(p.descricao+' '+p.codigo).toLowerCase().includes(q));
  $('#view').innerHTML=`
    <div class="page-head">
      <h2>Cadastro de Produtos</h2><div class="spacer"></div>
      <div class="search"><span class="ic">🔍</span>
        <input placeholder="Buscar produto..." value="${esc(S.search.cadastros)}"
          oninput="S.search.cadastros=this.value;renderCadastros();this.focus()"></div>
      <button class="btn sm" onclick="openProduto()">+ Novo produto</button>
    </div>
    <div class="card" style="padding:0">
      <table>
        <thead><tr><th>Código</th><th>Descrição</th><th>Tipo</th><th>Matéria Prima</th>
          <th>Range (mm)</th><th>Cor</th><th class="num">Compr.</th><th class="num">Varetas</th><th class="num">Pesos</th><th></th></tr></thead>
        <tbody>${ list.length ? list.map(rowProduto).join('') :
          `<tr><td colspan="10"><div class="empty">Nenhum produto cadastrado ainda. Clique em <b>+ Novo produto</b>.</div></td></tr>`}</tbody>
      </table>
    </div>`;
}
function rowProduto(p){
  const mp = p.materia_prima==='Aluminio'?'<span class="tag alu">Alumínio</span>':(p.materia_prima==='Aco'?'<span class="tag aco">Aço</span>':'—');
  const range = (p.range_min!=null&&p.range_max!=null)?`${fmtN(p.range_min)} – ${fmtN(p.range_max)}`:'—';
  const pesos = Array.isArray(p.pesos)?p.pesos.length:0;
  return `<tr>
    <td><b>${esc(p.codigo)}</b></td><td>${esc(p.descricao)}</td><td>${esc(p.tipo||'—')}</td>
    <td>${mp}</td><td class="num">${range}</td><td>${esc(p.cor||'—')}</td>
    <td class="num">${p.comprimento??'—'}</td><td class="num">${p.qtd_varetas??'—'}</td>
    <td class="num">${pesos}</td>
    <td class="row-actions" style="white-space:nowrap">
      <button title="Editar" onclick="openProduto('${p.id}')">✏️</button>
      <button class="del" title="Excluir" onclick="delProduto('${p.id}')">🗑️</button></td></tr>`;
}

/* ---- Modal de produto ---- */
function openProduto(id){
  const p = id ? S.produtos.find(x=>x.id===id) : null;
  const pesos = p&&Array.isArray(p.pesos)?JSON.parse(JSON.stringify(p.pesos)):[];
  window._pesos = pesos;
  modal(`${p?'Editar':'Novo'} Produto`, `
    <div class="grid">
      <div class="fld"><label>Código <span class="req">*</span></label>
        <input id="f_codigo" value="${esc(p?.codigo||'')}" oninput="reparse()"></div>

function reparse(){
  const nome=($('#f_descricao')?.value||'')+' '+($('#f_codigo')?.value||'');
  const o=parseDescricao(nome);
  // só auto-preenche se ainda estiver vazio (não sobrescreve edição manual)
  const auto=(elId,val,flagId)=>{ const el=$(elId),fl=$(flagId);
    if(el && (el.value==='' ) && val!=null && val!==''){ el.value=val; if(fl){fl.textContent='auto';fl.className='auto-flag';} } };
  auto('#f_tipo',o.tipo,'#fl_tipo');
  auto('#f_mp',o.materia_prima,'#fl_mp');
  auto('#f_cor',o.cor,'#fl_cor');
  auto('#f_rmin',o.range_min!=null?fmtN(o.range_min):'','#fl_range');
  auto('#f_rmax',o.range_max!=null?fmtN(o.range_max):'',null);
  auto('#f_comp',o.comprimento,'#fl_comp');
  auto('#f_var',o.qtd_varetas,'#fl_var');
  const box=$('#autoAlert');
  if(box){
    if(o.alertas.length) box.innerHTML=`<div class="breakdown" style="background:#fff8e6;border-color:#f0dca0"><b style="color:${'#9a7400'}">⚠ Preencha manualmente:</b> ${o.alertas.join(', ')} — não foi possível identificar pela descrição.</div>`;
    else box.innerHTML='';
  }
}
function renderPesos(){
  const box=$('#pesosBox'); if(!box) return;

async function saveProduto(id){
  const codigo=$('#f_codigo').value.trim(), descricao=$('#f_descricao').value.trim();
  if(!codigo||!descricao){ toast('Código e Descrição são obrigatórios','err'); return; }
  const rec={ codigo, descricao,
    tipo:$('#f_tipo').value||null,
    materia_prima:$('#f_mp').value||null,
    cor:$('#f_cor').value.trim()||null,
    range_min: $('#f_rmin').value?brNum($('#f_rmin').value):null,
    range_max: $('#f_rmax').value?brNum($('#f_rmax').value):null,
    comprimento: $('#f_comp').value?parseInt($('#f_comp').value,10):null,
    qtd_varetas: $('#f_var').value?parseInt($('#f_var').value,10):null,
    pesos: window._pesos.filter(r=>r.bitola||r.peso),
    created_by:S.user.email
  };
  let error;
  if(id){ ({error}=await sb.from('produtos').update(rec).eq('id',id)); }
  else  { ({error}=await sb.from('produtos').insert(rec)); }
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  await loadProdutos(); closeModal(); renderCadastros();
  toast(id?'Produto atualizado':'Produto cadastrado','ok');
  logAcao(id?'editar_produto':'novo_produto',descricao);
}
async function delProduto(id){
  const p=S.produtos.find(x=>x.id===id);
  confirmBox(`Excluir o produto <b>${esc(p?.descricao||'')}</b>? Isso também remove a precificação dele.`, async ()=>{
    const {error}=await sb.from('produtos').delete().eq('id',id);
    if(error){ toast('Erro ao excluir','err'); return; }
    await loadProdutos(); await loadPrecos(); closeModal(); renderCadastros();
    toast('Produto excluído','ok'); logAcao('excluir_produto',p?.descricao);
  });
}

function currentPeso(){ return brNum($('#p_peso')?.value); }
function recalc(){
  const peso=currentPeso();
  const vd=brNum($('#p_vd')?.value), vp=brNum($('#p_vp')?.value);
  const rd=vd*peso, rp=vp*peso;
  if(window._precCtx.valEditD==null){ $('#p_rd').value=fmtN(rd); window._precCtx.valEditD=rd; }
  if(window._precCtx.valEditP==null){ $('#p_rp').value=fmtN(rp); window._precCtx.valEditP=rp; }
  // se usuário não editou manualmente, acompanha o cálculo:
  if(!$('#p_rd').dataset.touched){ $('#p_rd').value=fmtN(rd); window._precCtx.valEditD=rd; }
  if(!$('#p_rp').dataset.touched){ $('#p_rp').value=fmtN(rp); window._precCtx.valEditP=rp; }
  drawBreakdown();
}
const TAX={'18':0.2725,'12':0.2125,'7':0.1625,'simples':0.06};
function drawBreakdown(){
  const box=$('#breakdown'); if(!box) return;
  const cfg=S.config||{};
  const V=window._precCtx.valEditD||0; // rateio sobre o valor de distribuidor
  const fat=Number(cfg.faturamento_mes)||0;
  const frFixo = fat>0 ? (Number(cfg.custos_fixos)||0)/fat : 0;
  const frVar  = fat>0 ? (Number(cfg.custos_variaveis)||0)/fat : 0;
  const fidcPct=(Number(cfg.custo_fidc_pct)||0)/100;
  const icms=$('#p_icms')?.value||'18';
  const taxPct=TAX[icms];
  const vFixo=V*frFixo, vVar=V*frVar, vFidc=V*fidcPct, vImp=V*taxPct;
  const sobra=V-vFixo-vVar-vFidc-vImp;
  const prod = S.produtos.find(x=>x.id===window._precCtx.pid);
  const pname = prod?.descricao||'';
  const bitSel = window._precCtx.bitola||'';
  const peso = brNum($('#p_peso')?.value);
  const custoKg = custoKgMP(prod?.materia_prima, bitSel);
  const custoMP = custoKg!=null ? custoKg*peso : null;
  const lucro = custoMP!=null ? sobra - custoMP : null;
  const lucroPct = (lucro!=null && V>0) ? (lucro/V*100) : null;
  const matLbl = prod?.materia_prima==='Aluminio'?'Alumínio':(prod?.materia_prima==='Aco'?'Aço':'—');
  let mpHtml;
  if(custoKg!=null){
    mpHtml=`
    <div class="lin"><span>Valor do Kg da MP (líquido)</span><span>${fmtBRL(custoKg)}</span></div>
    <div class="lin"><span>Valor de custo da MP (peso × kg)</span><span>${fmtBRL(custoMP)}</span></div>
    <div class="lin total"><span>Lucro da operação</span><span style="color:${lucro>=0?'var(--verde)':'var(--vermelho)'}">${fmtBRL(lucro)} <small style="color:var(--muted)">(${fmtN(lucroPct,1)}% sobre a venda)</small></span></div>`;
  } else {
    mpHtml=`<div class="hint" style="margin-top:8px">⚠ Cadastre o custo da bitola <b>${esc(bitSel||'—')}</b> (${matLbl}) na aba <b>Custo de Matéria-Prima</b> para ver o custo da MP e o lucro da operação.</div>`;
  }
  box.innerHTML=`<div class="breakdown">
    Conforme o faturamento de <b>${fmtBRL(fat)}</b>, o produto <b>${esc(pname)}</b> terá um valor de venda (distribuidor) de <b>${fmtBRL(V)}</b>, onde:
    <div class="lin"><span>Custos fixos</span><span>${fmtBRL(vFixo)} <small style="color:var(--muted)">(${fmtN(frFixo*100,1)}%)</small></span></div>
    <div class="lin"><span>Custos variáveis</span><span>${fmtBRL(vVar)} <small style="color:var(--muted)">(${fmtN(frVar*100,1)}%)</small></span></div>
    <div class="lin"><span>Antecipação FIDC</span><span>${fmtBRL(vFidc)} <small style="color:var(--muted)">(${fmtN(fidcPct*100,1)}%)</small></span></div>
    <div class="lin"><span>Impostos (${icms==='simples'?'Simples 6%':'ICMS '+icms+'%'})</span><span>${fmtBRL(vImp)} <small style="color:var(--muted)">(${fmtN(taxPct*100,2)}%)</small></span></div>
    <div class="lin total"><span>Margem restante</span><span style="color:${sobra>=0?'var(--verde)':'var(--vermelho)'}">${fmtBRL(sobra)}</span></div>
    ${mpHtml}
    ${fat<=0?'<div class="hint" style="margin-top:8px">⚠ Defina o faturamento e custos na aba <b>Custos Fixos e Variáveis</b> para o rateio.</div>':''}
  </div>`;
}
async function savePrecificacao(pid){
  const peso=currentPeso();
  if(!peso||peso<=0){ toast('Informe o peso da alça','err'); return; }
  const p=S.produtos.find(x=>x.id===pid);
  const bit = (window._precCtx.bitola||'').trim();
  const rec={ produto_id:pid, bitola: bit, peso,
    variavel_distribuidor:brNum($('#p_vd').value), variavel_provedor:brNum($('#p_vp').value),
    valor_distribuidor:brNum($('#p_rd').value), valor_provedor:brNum($('#p_rp').value),
    icms_flag:$('#p_icms').value, updated_by:S.user.email };
  // grava/atualiza a bitola no cadastro do produto (mini-tabela de pesos)
  if(bit){
    let pesos=Array.isArray(p.pesos)?JSON.parse(JSON.stringify(p.pesos)):[];
    const ex=pesos.find(x=>normBit(x.bitola)===normBit(bit));
    if(ex) ex.peso=peso; else pesos.push({bitola:bit,peso});
    await sb.from('produtos').update({pesos}).eq('id',pid);
  }
  const {error}=await sb.from('precificacoes').upsert(rec,{onConflict:'produto_id,bitola'});
  if(error){ toast('Erro ao salvar precificação: '+error.message,'err'); return; }
  await loadProdutos(); await loadPrecos(); closeModal(); renderFormacao();
  toast('Precificação salva','ok'); logAcao('precificar',p.descricao+(bit?' · '+bit:''));
}

/* ---- Sub-aba: Variáveis de Precificação ---- */
function subVariaveis(){

  $('#subview').innerHTML=`
    <div class="card">
      <p style="margin:0 0 16px;color:var(--muted);font-size:13.5px">Valores padrão usados ao precificar um novo produto (R$ por kg). O sistema puxa automaticamente o par conforme a <b>matéria prima</b> do produto (Aço ou Alumínio).</p>

      <div style="display:flex;align-items:center;gap:8px;margin:2px 0 10px"><span class="tag aco">Aço</span></div>
      <div class="grid">
        <div class="fld"><label>Distribuidor (R$/kg) → VARIÁVEL_DISTRIBUIDOR (Aço)</label>
          <div class="inline-prefix"><span>R$</span><input id="v_dist_aco" value="${fmtN(c.var_dist_aco||0)}" onkeyup="maskBRL(this)"></div></div>
        <div class="fld"><label>Provedor (R$/kg) → VARIÁVEL_PROVEDOR (Aço)</label>
          <div class="inline-prefix"><span>R$</span><input id="v_prov_aco" value="${fmtN(c.var_prov_aco||0)}" onkeyup="maskBRL(this)"></div></div>

        <div class="fld"><label>Provedor (R$/kg) → VARIÁVEL_PROVEDOR (Alumínio)</label>

async function saveVariaveis(){
  const rec={
    var_dist_aco:brNum($('#v_dist_aco').value), var_prov_aco:brNum($('#v_prov_aco').value),
    var_dist_alu:brNum($('#v_dist_alu').value), var_prov_alu:brNum($('#v_prov_alu').value)
  };
  const {error}=await sb.from('configuracoes').update(rec).eq('id',1);
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  await loadConfig(); renderFormacao(); toast('Variáveis atualizadas','ok'); logAcao('config_variaveis');
}
// retorna o par de variáveis padrão conforme a matéria prima do produto
function variaveisPorMateria(mp){
  const c=S.config||{};
  if(mp==='Aluminio') return {dist:c.var_dist_alu||0, prov:c.var_prov_alu||0};
  return {dist:c.var_dist_aco||0, prov:c.var_prov_aco||0}; // Aço (padrão)
}
// ---- Custo de Matéria-Prima ----
const MP_IMPOSTOS=[['icms','ICMS'],['ipi','IPI'],['pis','PIS'],['cofins','COFINS']];
function mpCustoLiquido(r){
  const b=brNum(r.preco_bruto); let cred=0, cost=0;
  MP_IMPOSTOS.forEach(([k])=>{ const pct=(Number(r[k+'_pct'])||0)/100; if(r[k+'_credita']) cred+=pct; else cost+=pct; });
  return b*(1-cred+cost);
}
function normBit(s){ return String(s||'').toLowerCase().replace(/mm/g,'').replace(/\s/g,'').replace('.',',').trim(); }
function custoKgMP(material, bitola){
  const nb=normBit(bitola);
  const row=(S.mpcustos||[]).find(r=>r.material===material && normBit(r.bitola)===nb);
  return row? mpCustoLiquido(row) : null;
}

/* ---- Sub-aba: Custo de Matéria-Prima ---- */
function novaLinhaMP(material){ return {id:null, material, bitola:'', preco_bruto:0,
  icms_pct:0, icms_credita:true, ipi_pct:0, ipi_credita:false, pis_pct:0, pis_credita:true, cofins_pct:0, cofins_credita:true, _novo:true}; }
function subCustoMP(){
  // carrega cópia editável
  window._mpEdit = (S.mpcustos||[]).map(r=>JSON.parse(JSON.stringify(r)));
  window._mpRemovidos = [];
  renderMP();
}
function renderMP(){
  $('#subview').innerHTML=`
    <div class="card">
      <p style="margin:0 0 4px;color:var(--muted);font-size:13.5px">Cadastre o preço de compra (R$/kg) por <b>bitola</b> de cada matéria-prima e os impostos de compra. Em cada imposto escolha <b>Creditar</b> (desconta do custo) ou <b>Incorporar</b> (soma ao custo). O <b>custo líquido</b> é usado no cálculo do lucro na precificação.</p>
      <div class="hint" style="margin-bottom:14px">Custo líquido = Preço bruto − (impostos que creditam) + (impostos que incorporam).</div>
      ${blocoMP('Aco','Aço')}
      ${blocoMP('Aluminio','Alumínio')}
      <div style="margin-top:18px"><button class="btn sm" onclick="saveMP()">Salvar custos de MP</button></div>
    </div>`;
}
function blocoMP(mat, label){
  const linhas=window._mpEdit.filter(r=>r.material===mat);
  const tagc = mat==='Aluminio'?'alu':'aco';
  return `
    <div style="display:flex;align-items:center;gap:8px;margin:16px 0 8px"><span class="tag ${tagc}">${label}</span></div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>Bitola</th><th class="num">Preço bruto (R$/kg)</th>
        <th>ICMS</th><th>IPI</th><th>PIS</th><th>COFINS</th>
        <th class="num">Custo líq. (R$/kg)</th><th></th>
      </tr></thead>
      <tbody>
      ${linhas.length? linhas.map(r=>linhaMP(r)).join('') : `<tr><td colspan="8"><div class="empty">Nenhuma bitola de ${label}. Adicione abaixo.</div></td></tr>`}
      </tbody>
    </table>
    </div>
    <button class="btn ghost" style="margin-top:8px" onclick="addMP('${mat}')">+ Adicionar bitola de ${label}</button>`;
}
function impostoCell(r, k){
  const idx=window._mpEdit.indexOf(r);
  return `<div style="display:flex;flex-direction:column;gap:4px;min-width:118px">
    <div class="inline-prefix"><input style="padding-left:9px" value="${r[k+'_pct']!=null?String(r[k+'_pct']).replace('.',','):''}" placeholder="%" oninput="window._mpEdit[${idx}]['${k}_pct']=brNum(this.value);mpRecalcLinha(${idx})">
    </div>
    <select style="padding:5px 6px;border:1px solid var(--borda);border-radius:6px;font-size:12px" onchange="window._mpEdit[${idx}]['${k}_credita']=(this.value==='1');mpRecalcLinha(${idx})">
      <option value="1" ${r[k+'_credita']?'selected':''}>Creditar (−)</option>
      <option value="0" ${!r[k+'_credita']?'selected':''}>Incorporar (+)</option>
    </select></div>`;
}
function linhaMP(r){
  const idx=window._mpEdit.indexOf(r);
  return `<tr>
    <td><input value="${esc(r.bitola||'')}" placeholder="ex: 1,68mm" style="padding:7px 9px;border:1px solid var(--borda);border-radius:6px;width:100px" oninput="window._mpEdit[${idx}].bitola=this.value"></td>
    <td class="num"><div class="inline-prefix" style="max-width:130px"><span>R$</span><input value="${fmtN(r.preco_bruto||0)}" onkeyup="maskBRL(this);window._mpEdit[${idx}].preco_bruto=brNum(this.value);mpRecalcLinha(${idx})" style="padding-left:30px;width:130px"></div></td>
    <td>${impostoCell(r,'icms')}</td>
    <td>${impostoCell(r,'ipi')}</td>
    <td>${impostoCell(r,'pis')}</td>
    <td>${impostoCell(r,'cofins')}</td>
    <td class="num" id="mpliq_${idx}"><b>${fmtBRL(mpCustoLiquido(r))}</b></td>
    <td class="row-actions"><button class="del" onclick="delMP(${idx})">🗑️</button></td>
  </tr>`;
}
function mpRecalcLinha(idx){ const el=$('#mpliq_'+idx); if(el) el.innerHTML='<b>'+fmtBRL(mpCustoLiquido(window._mpEdit[idx]))+'</b>'; }
function addMP(mat){ window._mpEdit.push(novaLinhaMP(mat)); renderMP(); }
function delMP(idx){ const r=window._mpEdit[idx]; if(r && r.id) window._mpRemovidos.push(r.id); window._mpEdit.splice(idx,1); renderMP(); }
async function saveMP(){
  const rows=window._mpEdit.filter(r=>String(r.bitola||'').trim());
  // valida bitola duplicada por material
  const chaves=new Set();
  for(const r of rows){ const k=r.material+'|'+normBit(r.bitola); if(chaves.has(k)){ toast('Bitola repetida em '+(r.material==='Aluminio'?'Alumínio':'Aço')+': '+r.bitola,'err'); return; } chaves.add(k); }
  // remove os excluídos
  if(window._mpRemovidos.length){ await sb.from('materia_prima_custos').delete().in('id',window._mpRemovidos); }
  // upsert
  const payload=rows.map(r=>({ ...(r.id?{id:r.id}:{}), material:r.material, bitola:r.bitola.trim(), preco_bruto:brNum(r.preco_bruto),
    icms_pct:Number(r.icms_pct)||0, icms_credita:!!r.icms_credita, ipi_pct:Number(r.ipi_pct)||0, ipi_credita:!!r.ipi_credita,
    pis_pct:Number(r.pis_pct)||0, pis_credita:!!r.pis_credita, cofins_pct:Number(r.cofins_pct)||0, cofins_credita:!!r.cofins_credita,
    updated_by:S.user.email }));
  const {error}=await sb.from('materia_prima_custos').upsert(payload,{onConflict:'material,bitola'});
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  await loadMP(); renderFormacao(); toast('Custos de MP salvos','ok'); logAcao('config_mp');
}

/* ============================================================
   TELA: CONFIGURAÇÕES
   ============================================================ */
async function renderConfig(){
  const c=S.config||{};
  $('#view').innerHTML=`
    <div class="page-head"><h2>Configurações</h2></div>
    <div class="card">
      <h3 style="margin:0 0 4px">Descontos por tipo de cliente</h3>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Desconto (%) aplicado sobre toda a Tabela de Preços. ICMS 18% normalmente fica em 0 (valor cheio).</p>
      <div class="grid g3">
        <div class="fld"><label>ICMS 18% (valor cheio)</label><input id="d18" type="number" step="0.01" value="${c.desc_icms18??0}"></div>
        <div class="fld"><label>ICMS 12% — desconto %</label><input id="d12" type="number" step="0.01" value="${c.desc_icms12??0}"></div>
        <div class="fld"><label>ICMS 7% — desconto %</label><input id="d7" type="number" step="0.01" value="${c.desc_icms7??0}"></div>
        <div class="fld"><label>Simples Nacional — desconto %</label><input id="ds" type="number" step="0.01" value="${c.desc_simples??0}"></div>
      </div>
      <div style="margin-top:16px"><button class="btn sm" onclick="saveDescontos()">Salvar descontos</button></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center"><h3 style="margin:0">Usuários</h3><div class="spacer" style="flex:1"></div>
        <button class="btn sm" onclick="openNovoUsuario()">+ Novo usuário</button></div>
      <div id="usersBox" style="margin-top:12px"><div class="empty">Carregando...</div></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Log de atividades</h3>
      <div id="logsBox"><div class="empty">Carregando...</div></div>
    </div>`;

}
async function saveDescontos(){
  const rec={ desc_icms18:parseFloat($('#d18').value)||0, desc_icms12:parseFloat($('#d12').value)||0,
    desc_icms7:parseFloat($('#d7').value)||0, desc_simples:parseFloat($('#ds').value)||0 };
  const {error}=await sb.from('configuracoes').update(rec).eq('id',1);
  if(error){ toast('Erro ao salvar','err'); return; }
  await loadConfig(); toast('Descontos atualizados','ok'); logAcao('config_descontos');
}
async function loadUsers(){
  const {data,error}=await sb.from('perfis').select('*').order('created_at');
  const box=$('#usersBox'); if(!box) return;
  if(error){ box.innerHTML=`<div class="empty">Não foi possível listar usuários.</div>`; return; }
  box.innerHTML=`<table><thead><tr><th>Nome</th><th>E-mail</th><th>Papel</th><th>Desde</th></tr></thead>
    <tbody>${(data||[]).map(u=>`<tr><td>${esc(u.nome||'—')}</td><td>${esc(u.email)}</td>
      <td><span class="tag ${u.papel==='admin'?'alu':'aco'}">${esc(u.papel||'usuario')}</span></td>
      <td>${new Date(u.created_at).toLocaleDateString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Nenhum usuário.</div></td></tr>'}</tbody></table>`;
}
async function loadLogs(){
  const {data}=await sb.from('logs').select('*').order('created_at',{ascending:false}).limit(60);
  const box=$('#logsBox'); if(!box) return;
  box.innerHTML=`<table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Detalhe</th></tr></thead>
    <tbody>${(data||[]).map(l=>`<tr><td>${new Date(l.created_at).toLocaleString('pt-BR')}</td>
      <td>${esc(l.user_email||'—')}</td><td>${esc(l.acao||'')}</td><td>${esc(l.detalhe||'')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Sem registros.</div></td></tr>'}</tbody></table>`;
}
function openNovoUsuario(){
  modal('Novo usuário', `
    <div class="grid">
      <div class="fld"><label>Nome</label><input id="u_nome"></div>
      <div class="fld"><label>E-mail <span class="req">*</span></label><input id="u_email" type="email"></div>
      <div class="fld"><label>Senha <span class="req">*</span></label><input id="u_pass" type="password"></div>
      <div class="fld"><label>Papel</label><select id="u_papel"><option value="usuario">Usuário</option><option value="admin">Admin</option></select></div>
    </div>
    <div class="hint">O usuário é criado no Supabase Auth. Se a confirmação de e-mail estiver ativada no projeto, ele precisará confirmar antes de entrar.</div>
  `, [
    {txt:'Cancelar',cls:'ghost',fn:closeModal},
    {txt:'Criar usuário',cls:'',fn:criarUsuario}
  ]);
}
async function criarUsuario(){
  const nome=$('#u_nome').value.trim(), email=$('#u_email').value.trim(), password=$('#u_pass').value, papel=$('#u_papel').value;
  if(!email||!password){ toast('E-mail e senha obrigatórios','err'); return; }
  // cliente temporário para NÃO trocar a sessão do admin logado
  const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
  const {data,error}=await tmp.auth.signUp({email,password,options:{data:{nome}}});
  if(error){ toast('Erro ao criar: '+error.message,'err'); return; }
  // define papel no perfil (o gatilho já criou a linha)
  if(data.user){ await sb.from('perfis').update({nome,papel}).eq('id',data.user.id); }
  closeModal(); loadUsers(); toast('Usuário criado','ok'); logAcao('novo_usuario',email);
}

/* ============================================================
   MODAL / CONFIRM
   ============================================================ */
function modal(titulo, body, botoes){
  $('#modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><div class="m-head"><h3>${esc(titulo)}</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="m-body">${body}</div>
    <div class="m-foot">${botoes.map((b,i)=>`<button class="btn ${b.cls} sm" id="mb_${i}">${esc(b.txt)}</button>`).join('')}</div>
    </div></div>`;
  botoes.forEach((b,i)=>$('#mb_'+i).onclick=b.fn);
  // marca campos de valor final como "tocados" ao editar
  ['p_rd','p_rp'].forEach(id=>{const el=$('#'+id); if(el) el.addEventListener('keyup',()=>el.dataset.touched='1');});
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmBox(html, onOk){
  modal('Confirmar', `<div style="font-size:14.5px;line-height:1.5">${html}</div>`, [
    {txt:'Cancelar',cls:'ghost',fn:closeModal},
    {txt:'Confirmar',cls:'danger',fn:onOk}
  ]);
}

/* ============================================================
   INICIALIZAÇÃO — mantém sessão
   ============================================================ */
(async function init(){
  if(!sb){
    $('#loginMsg').className='msg err';
    $('#loginMsg').textContent='Não foi possível carregar a biblioteca do Supabase. Verifique a conexão e recarregue.';
    return;
  }
  if(SUPABASE_URL.startsWith('COLE_AQUI')){
    $('#loginMsg').className='msg err';
    $('#loginMsg').textContent='Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html.';
  }
  const {data}=await sb.auth.getSession();
  if(data?.session){ S.user=data.session.user; await startApp(); }
})();
</script>
